<script id="bank" type="application/json">[{"id":"CISHR-001","domain":"Core HR Applications and Employee Center","topic":"Lifecycle activity audience","difficulty":"Intermediate","question":"What is the purpose of an audience on a lifecycle event activity?","options":{"A":"To decide which administrators can install new plugins","B":"To decide which COE table inherits from HR Case","C":"To decide which subject people receive that activity","D":"To decide which catalog categories appear in search"},"correct_answer":"C","explanations":{"A":"Incorrect. Plugin installation permissions are unrelated to activity audiences.","B":"Incorrect. Audience filters do not change table inheritance.","C":"Correct. Audience conditions make event activities relevant to specific employees.","D":"Incorrect. Activity applicability is separate from catalog presentation."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":8,"B":9,"C":8,"D":8}},{"id":"CISHR-002","domain":"Core HR Applications and Employee Center","topic":"Case creation defaults","difficulty":"Advanced","question":"In an HRSD implementation review, an HR team wants consistent assignment fields on new cases. Which mechanism is appropriate?","options":{"A":"Require employees to edit table access controls on submission","B":"Create an additional COE for every new assigned agent","C":"Store assignment instructions only in catalog images","D":"Apply relevant HR case templates and assignment rules"},"correct_answer":"D","explanations":{"A":"Incorrect. Employees should not manage ACL settings.","B":"Incorrect. COEs represent HR functional domains rather than individuals.","C":"Incorrect. Images are not executable routing configuration.","D":"Correct. Templates and rules provide defaults and routing as configured."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":9,"B":9,"C":7,"D":8}},{"id":"CISHR-003","domain":"HR System Architecture","topic":"COE boundaries","difficulty":"Foundation","question":"Which implementation goal is directly supported by separate COE case tables?","options":{"A":"Replacing HR service configuration with catalog categories","B":"Separating sensitive case types and reporting","C":"Avoiding the need for case assignment entirely","D":"Sharing every confidential HR case with all employees"},"correct_answer":"B","explanations":{"A":"Incorrect. COEs do not eliminate request and fulfillment configuration.","B":"Correct. COE structure supports access boundaries and consistent measurement.","C":"Incorrect. Cases can still require groups and individual agents.","D":"Incorrect. COE separation is not an instruction to grant general access."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-centers-of-excellence-coes.html","concept_variant":1,"option_lengths_words":{"A":7,"B":6,"C":7,"D":8}},{"id":"CISHR-004","domain":"Platform, Role, and Contextual Security","topic":"Security group targeting","difficulty":"Intermediate","question":"In an HRSD implementation review, why use separate HR groups for highly sensitive fulfillment?","options":{"A":"Different group access policies can protect sensitive cases","B":"Separate groups replace every HR service configuration record","C":"All HR groups must contain every employee in the company","D":"Group separation automatically creates new employee profiles"},"correct_answer":"A","explanations":{"A":"Correct. Group separation helps implement least-privilege case handling.","B":"Incorrect. Groups control fulfillment and access, not service existence.","C":"Incorrect. General membership would weaken case confidentiality.","D":"Incorrect. Access groups do not ordinarily create HR profiles."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":10,"D":7}},{"id":"CISHR-005","domain":"HR System Architecture","topic":"HR profile separation","difficulty":"Advanced","question":"In an HRSD implementation review, which architectural practice best distinguishes HR profile information from HR cases?","options":{"A":"Use HR catalog categories as the employee master data","B":"Store every employee property in case short descriptions","C":"Replace all HR profile fields with assignment group names","D":"Keep person-related profile data separate from service requests"},"correct_answer":"D","explanations":{"A":"Incorrect. Catalog categories organize requests, not employee records.","B":"Incorrect. Case descriptions are not a substitute for structured profiles.","C":"Incorrect. Assignment groups are not authoritative person data.","D":"Correct. HR profile records concern people whereas cases represent work."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":9,"B":8,"C":9,"D":8}},{"id":"CISHR-006","domain":"HR System Architecture","topic":"Missing subject person","difficulty":"Foundation","question":"In an HRSD implementation review, what can happen when an HR case has no subject person selected?","options":{"A":"The catalog item creates a new COE at submission time","B":"Only HR services without HR criteria may appear","C":"Every HR service is automatically visible regardless of criteria","D":"The HR case is converted into an IT incident automatically"},"correct_answer":"B","explanations":{"A":"Incorrect. COEs are not generated by missing employee data.","B":"Correct. The documented case creation filter uses the subject person.","C":"Incorrect. Eligibility filtering is not disabled by missing subject data.","D":"Incorrect. A missing subject does not change the record class."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":2,"option_lengths_words":{"A":10,"B":8,"C":9,"D":10}},{"id":"CISHR-007","domain":"Platform, Role, and Contextual Security","topic":"Domain-specific approvals","difficulty":"Intermediate","question":"In an HRSD implementation review, which practice is recommended for HR approvals under domain separation?","options":{"A":"Expose all approvals as anonymous catalog items","B":"Assign every approval to a parent-domain global group","C":"Use approval groups specific to the relevant domain","D":"Let the employee portal theme decide approving users"},"correct_answer":"C","explanations":{"A":"Incorrect. Public approval exposure bypasses intended authorization.","B":"Incorrect. Global approval groups can create unintended visibility.","C":"Correct. Domain-specific approvers help avoid unauthorized access.","D":"Incorrect. Branding cannot determine approval permission."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-domain-rec.html","concept_variant":2,"option_lengths_words":{"A":7,"B":8,"C":8,"D":8}},{"id":"CISHR-008","domain":"HR System Architecture","topic":"Country and skills","difficulty":"Advanced","question":"Which matching rule normally precedes the skills-only HR rule?","options":{"A":"The agents-by-manager-hierarchy matching rule","B":"The agents-by-catalog-category matching rule","C":"The agents-by-last-login-time matching rule","D":"The agents-by-skills-and-country matching rule"},"correct_answer":"D","explanations":{"A":"Incorrect. Manager hierarchy is not the stated fallback sequence.","B":"Incorrect. Employee-facing categories do not define this default pair.","C":"Incorrect. Last login is not the default rule in this matching pair.","D":"Correct. The country-plus-skills rule has the higher priority."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":4,"B":4,"C":4,"D":4}},{"id":"CISHR-009","domain":"HR System Architecture","topic":"HR case inheritance","difficulty":"Foundation","question":"In an HRSD implementation review, which data-model relationship correctly describes an HR Center of Excellence?","options":{"A":"Its case table extends an HR Profile record","B":"Its case table extends the parent HR Case table","C":"Its case table extends an HR Catalog Item","D":"Its case table extends the Knowledge article table"},"correct_answer":"B","explanations":{"A":"Incorrect. HR profiles store person data rather than case types.","B":"Correct. COE-specific case tables extend sn_hr_core_case.","C":"Incorrect. Catalog items initiate requests rather than define case inheritance.","D":"Incorrect. Knowledge articles are content records rather than HR cases."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-centers-of-excellence-coes.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":8,"D":8}},{"id":"CISHR-010","domain":"Core HR Applications and Employee Center","topic":"Assignment rule applicability","difficulty":"Intermediate","question":"In an HRSD implementation review, when should an HR assignment rule set the assignment group?","options":{"A":"When the group is not already set by the relevant template","B":"Only when the assigned agent closes the HR case","C":"Only when the catalog item has no display category","D":"Whenever an employee changes the portal language"},"correct_answer":"A","explanations":{"A":"Correct. Assignment rules can determine an unpopulated HR group.","B":"Incorrect. Routing typically occurs before fulfillment is completed.","C":"Incorrect. Employee catalog grouping is unrelated to group assignment.","D":"Incorrect. Locale settings do not determine whether a group is set."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":11,"B":9,"C":9,"D":7}},{"id":"CISHR-011","domain":"Platform, Role, and Contextual Security","topic":"Review rights","difficulty":"Advanced","question":"In an HRSD implementation review, which approach is most defensible for reviewing HR data security before go-live?","options":{"A":"Check only that HR case numbers increment sequentially","B":"Test only the case creation form as an administrator","C":"Test cases across COEs with different access roles and groups","D":"Check only that Employee Center menus look correct"},"correct_answer":"C","explanations":{"A":"Incorrect. Case numbering does not establish security correctness.","B":"Incorrect. Admin-only testing will miss ordinary user restrictions.","C":"Correct. Representative access testing probes contextual boundaries.","D":"Incorrect. Menu visibility is not a substitute for data authorization."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":10,"D":8}},{"id":"CISHR-012","domain":"Platform, Role, and Contextual Security","topic":"Contextual security","difficulty":"Foundation","question":"Why is contextual HR security needed in addition to a broad HR role?","options":{"A":"Different cases may require access based on their context","B":"Every HR case should be searchable by anonymous users","C":"Portal styling is sufficient protection for case records","D":"All HR agents should have identical access to every case"},"correct_answer":"A","explanations":{"A":"Correct. Sensitive HR records need fine-grained authorization.","B":"Incorrect. Confidential employee information must be protected.","C":"Incorrect. Visual hiding cannot replace enforced data access.","D":"Incorrect. Uniform unrestricted access is often inappropriate."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":9,"B":9,"C":8,"D":10}},{"id":"CISHR-013","domain":"Core HR Applications and Employee Center","topic":"Lifecycle Event COE","difficulty":"Intermediate","question":"Which statement is accurate about the COE for an HR service configured with a lifecycle event?","options":{"A":"It cannot have a COE classification at all","B":"It may be associated with any appropriate COE","C":"It must always be assigned to Benefits COE","D":"It must always be categorized under Payroll COE"},"correct_answer":"B","explanations":{"A":"Incorrect. A COE is selectable during HR service configuration.","B":"Correct. The documented setup permits selecting any COE for this service.","C":"Incorrect. Lifecycle event classification is not limited to benefits.","D":"Incorrect. Lifecycle services are not restricted to payroll cases."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}},{"id":"CISHR-014","domain":"HR System Architecture","topic":"Record producers","difficulty":"Advanced","question":"In an HRSD implementation review, an existing internal HR service must become available in self-service. What should be added?","options":{"A":"A record producer linked to the existing service","B":"A second COE solely for employee requests","C":"A second HR service created from a new catalog item","D":"A new parent HR Case table for the request"},"correct_answer":"A","explanations":{"A":"Correct. It exposes the existing service without making a duplicate service.","B":"Incorrect. Self-service does not require a new COE.","C":"Incorrect. This risks producing a duplicate HR service.","D":"Incorrect. The existing table hierarchy is already sufficient."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":2,"option_lengths_words":{"A":8,"B":7,"C":10,"D":9}},{"id":"CISHR-015","domain":"Platform, Role, and Contextual Security","topic":"Security verification","difficulty":"Foundation","question":"How should restricted HR case permissions be validated?","options":{"A":"Assume a hidden portal link guarantees case protection","B":"Review only the HR catalog item's display title","C":"Test read and write using representative authorized users","D":"Test exclusively while logged in as system administrator"},"correct_answer":"C","explanations":{"A":"Incorrect. Direct data access may still require authorization enforcement.","B":"Incorrect. A label does not validate actual record access.","C":"Correct. Permission testing must reflect actual roles and context.","D":"Incorrect. Admin privileges can conceal ordinary access problems."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}},{"id":"CISHR-016","domain":"Core HR Applications and Employee Center","topic":"Employee-facing scope","difficulty":"Intermediate","question":"Which service belongs in an HR self-service catalog?","options":{"A":"Every internal-only service regardless of sensitivity","B":"Every HR service configuration record in the instance","C":"Only requests that create IT incidents rather than HR cases","D":"A service employees are permitted to request directly"},"correct_answer":"D","explanations":{"A":"Incorrect. Internal-only requests need not be employee-visible.","B":"Incorrect. Some HR services deliberately have no catalog item.","C":"Incorrect. HR catalog offerings ordinarily initiate HR cases.","D":"Correct. Employee-facing services are exposed through published HR items."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":6,"B":8,"C":10,"D":8}},{"id":"CISHR-017","domain":"Platform, Role, and Contextual Security","topic":"Cross-scope review","difficulty":"Advanced","question":"In an HRSD implementation review, an HR scoped component calls functionality in another scope. What should be considered?","options":{"A":"Cross-scope application access restrictions and approvals","B":"Only whether the user has a mobile app installed","C":"Only the number of HR catalog items in each category","D":"Only the employee portal's font and background colors"},"correct_answer":"A","explanations":{"A":"Correct. Application scopes impose boundaries on resource usage.","B":"Incorrect. Client app availability does not authorize scoped calls.","C":"Incorrect. Catalog size does not approve cross-scope execution.","D":"Incorrect. Branding does not control scoped application calls."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":6,"B":9,"C":10,"D":8}},{"id":"CISHR-018","domain":"Platform, Role, and Contextual Security","topic":"Platform ACLs","difficulty":"Foundation","question":"In an HRSD implementation review, what is the role of an access control rule in HRSD?","options":{"A":"Create a new HR service from every knowledge article","B":"Set the employee portal's visual card arrangement","C":"Enforce authorization for protected records or operations","D":"Determine the country used in assignment matching"},"correct_answer":"C","explanations":{"A":"Incorrect. Content records do not replace ACL design.","B":"Incorrect. Portal layout is a presentation concern.","C":"Correct. ACLs provide platform security checks beyond catalog visibility.","D":"Incorrect. Matching rules route cases rather than authorize access."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":9,"B":7,"C":7,"D":7}},{"id":"CISHR-019","domain":"Core HR Applications and Employee Center","topic":"Agent assignment skills","difficulty":"Intermediate","question":"Why assign skills to members of an HR fulfillment group?","options":{"A":"To grant the employee self-service administrator role","B":"To determine the color of HR catalog item cards","C":"To replace the subject person on every HR case","D":"To enable skill-qualified case and task matching"},"correct_answer":"D","explanations":{"A":"Incorrect. Agent skills are not equivalent to administrative roles.","B":"Incorrect. Catalog visual styling is separate from agent qualifications.","C":"Incorrect. Agent expertise does not identify the case's subject.","D":"Correct. Required skills help identify suitable agents for HR work."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":7,"B":9,"C":9,"D":7}},{"id":"CISHR-020","domain":"Core HR Applications and Employee Center","topic":"AWA capacity","difficulty":"Advanced","question":"In HR Advanced Work Assignment, what can capacity-based assignment consider?","options":{"A":"The last published Employee Center branding change","B":"Agents with available capacity for incoming work","C":"Catalog category names ordered alphabetically","D":"The number of HR profiles stored in the instance"},"correct_answer":"B","explanations":{"A":"Incorrect. Branding changes are irrelevant to agent capacity.","B":"Correct. AWA routing evaluates agent availability and work capacity.","C":"Incorrect. Catalog sort order does not define agent capacity.","D":"Incorrect. Profile volume does not give an agent's available capacity."},"source_url":"https://www.servicenow.com/docs/r/xanadu/employee-service-management/hr-service-delivery/awa-hr-overview.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":5,"D":9}},{"id":"CISHR-021","domain":"HR System Architecture","topic":"Plugins","difficulty":"Foundation","question":"In an HRSD implementation review, before configuring an optional HR capability, what should the team confirm?","options":{"A":"All HR services have been exposed in the IT catalog","B":"All users have been assigned an HR administrator role","C":"Its required applications and plugins are available","D":"The employee portal uses the default company logo"},"correct_answer":"C","explanations":{"A":"Incorrect. Catalog exposure is unrelated to application availability.","B":"Incorrect. Administrative roles should not be broadly granted.","C":"Correct. Capabilities depend on installed and activated application components.","D":"Incorrect. Branding does not establish installed functionality."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":10,"B":9,"C":7,"D":8}},{"id":"CISHR-022","domain":"HR System Architecture","topic":"Service creation","difficulty":"Intermediate","question":"In an HRSD implementation review, an administrator creates a new employee-facing HR offering. Which route avoids duplicate HR services?","options":{"A":"Create a new HR catalog item with its corresponding service","B":"Create two HR services and bind both to one record producer","C":"Create an HR task without establishing an HR service","D":"Create a knowledge article and use it as the case table"},"correct_answer":"A","explanations":{"A":"Correct. ServiceNow can create the linked service from the new item.","B":"Incorrect. Duplicating the service does not simplify setup.","C":"Incorrect. A standalone task does not define a service request.","D":"Incorrect. Articles are content, not replacements for HR cases."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":2,"option_lengths_words":{"A":10,"B":11,"C":9,"D":11}},{"id":"CISHR-023","domain":"Core HR Applications and Employee Center","topic":"Audience default","difficulty":"Advanced","question":"In an HRSD implementation review, if a lifecycle event activity has no audience record, what is its default applicability?","options":{"A":"The activity is visible only to the system administrator","B":"The activity is converted into an approval automatically","C":"The activity is skipped for every employee by default","D":"The activity applies to all employees in that event"},"correct_answer":"D","explanations":{"A":"Incorrect. An absent audience is not an admin-only setting.","B":"Incorrect. Audience membership does not change the activity type.","C":"Incorrect. No audience does not mean exclude everyone.","D":"Correct. An unrestricted activity can trigger for every subject person."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":9,"B":8,"C":9,"D":9}},{"id":"CISHR-024","domain":"Core HR Applications and Employee Center","topic":"Lifecycle content","difficulty":"Foundation","question":"In an HRSD implementation review, which supporting component provides scheduled content in a lifecycle event?","options":{"A":"A user role that exposes all confidential documents","B":"A scheduled content template for the activity","C":"A matching rule that ignores employee attributes","D":"A database index on the HR Case extension table"},"correct_answer":"B","explanations":{"A":"Incorrect. Broad roles are not a content scheduling mechanism.","B":"Correct. Content activities can publish content across supported employee channels.","C":"Incorrect. Agent assignment rules do not schedule content.","D":"Incorrect. Indexes do not define employee-facing scheduled content."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":8,"B":7,"C":7,"D":9}},{"id":"CISHR-025","domain":"Core HR Applications and Employee Center","topic":"Lifecycle Event association","difficulty":"Intermediate","question":"Which field connects a lifecycle-event HR service to its event?","options":{"A":"Knowledge article author","B":"Catalog display category","C":"Agent workspace theme","D":"Lifecycle event type"},"correct_answer":"D","explanations":{"A":"Incorrect. Article authors do not identify lifecycle event configurations.","B":"Incorrect. Catalog categories organize presentation rather than fulfillment events.","C":"Incorrect. Workspace theming does not select lifecycle event fulfillment.","D":"Correct. The selected event defines which lifecycle event fulfills the service."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":3,"B":3,"C":3,"D":3}},{"id":"CISHR-026","domain":"Platform, Role, and Contextual Security","topic":"Role design","difficulty":"Advanced","question":"Which access approach best protects confidential HR cases?","options":{"A":"Replace all HR security policies with portal categories","B":"Grant only the roles and case access required for work","C":"Share privileged HR accounts among every team member","D":"Grant every employee all HR administrative permissions"},"correct_answer":"B","explanations":{"A":"Incorrect. Catalog organization cannot enforce record access.","B":"Correct. Least privilege limits unnecessary exposure to HR data.","C":"Incorrect. Shared accounts damage traceability and least privilege.","D":"Incorrect. Broad admin access defeats confidentiality safeguards."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":8,"B":10,"C":8,"D":7}},{"id":"CISHR-027","domain":"Core HR Applications and Employee Center","topic":"Lifecycle Event COE","difficulty":"Foundation","question":"In an HRSD implementation review, which statement is accurate about the COE for an HR service configured with a lifecycle event?","options":{"A":"It must always be assigned to Benefits COE","B":"It must always be categorized under Payroll COE","C":"It may be associated with any appropriate COE","D":"It cannot have a COE classification at all"},"correct_answer":"C","explanations":{"A":"Incorrect. Lifecycle event classification is not limited to benefits.","B":"Incorrect. Lifecycle services are not restricted to payroll cases.","C":"Correct. The documented setup permits selecting any COE for this service.","D":"Incorrect. A COE is selectable during HR service configuration."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}},{"id":"CISHR-028","domain":"HR System Architecture","topic":"HR case options","difficulty":"Intermediate","question":"Where can an implementer choose to bypass automatic assignment for a particular service?","options":{"A":"The case options of the HR service configuration","B":"The system locale associated with the HR agent","C":"The name field of the employee catalog category","D":"The logo settings of the employee portal"},"correct_answer":"A","explanations":{"A":"Correct. Service-level case options can skip automatic assignment.","B":"Incorrect. User locale does not switch service-level assignment.","C":"Incorrect. Catalog labels do not control assignment execution.","D":"Incorrect. Branding cannot disable case assignment logic."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":7}},{"id":"CISHR-029","domain":"Platform, Role, and Contextual Security","topic":"Security performance","difficulty":"Advanced","question":"A COE security policy uses many complex record conditions. What should the reviewer consider?","options":{"A":"Whether agents have identical browser favorites","B":"Whether every case has exactly one attachment","C":"Their possible effect on authorization-check performance","D":"Whether the catalog item icon has adequate contrast"},"correct_answer":"C","explanations":{"A":"Incorrect. Browser favorites are unrelated to authorization evaluation.","B":"Incorrect. Attachment count is not the core policy-condition concern.","C":"Correct. The documentation cautions that condition complexity can affect performance.","D":"Incorrect. Icon visibility does not assess policy evaluation overhead."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":6,"B":7,"C":6,"D":8}},{"id":"CISHR-030","domain":"HR System Architecture","topic":"COE organization","difficulty":"Foundation","question":"In an HRSD implementation review, how should an implementer categorize HR services within a COE?","options":{"A":"Use assignment group and assigned agent","B":"Use HR topic category and HR topic detail","C":"Use catalog category and catalog subcategory","D":"Use employee department and cost center"},"correct_answer":"B","explanations":{"A":"Incorrect. Assignment fields route work but do not define service taxonomy.","B":"Correct. These provide first- and second-level HR service categorization.","C":"Incorrect. Catalog taxonomy is employee-facing and separate from COE categorization.","D":"Incorrect. Employee organizational fields do not establish the COE category structure."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-centers-of-excellence-coes.html","concept_variant":2,"option_lengths_words":{"A":6,"B":8,"C":6,"D":6}},{"id":"CISHR-031","domain":"HR System Architecture","topic":"Record producer fields","difficulty":"Intermediate","question":"In an HRSD implementation review, what can an HR catalog item configuration determine?","options":{"A":"The database encryption algorithm for every HR case","B":"The inheritance chain of every COE case table","C":"The company hierarchy on every user's profile","D":"The fields collected from employees during submission"},"correct_answer":"D","explanations":{"A":"Incorrect. This belongs to platform security configuration.","B":"Incorrect. Table inheritance is independent of record producer fields.","C":"Incorrect. Organization data is outside catalog item presentation.","D":"Correct. Record producers define the input shown for the service request."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":7,"D":7}},{"id":"CISHR-032","domain":"Core HR Applications and Employee Center","topic":"HR service fulfillment","difficulty":"Advanced","question":"What does an HR service configuration primarily connect?","options":{"A":"Request initiation with the intended fulfillment process","B":"Company departments with all platform admin roles","C":"Knowledge article images with agent login sessions","D":"Employee portal branding with system database indexing"},"correct_answer":"A","explanations":{"A":"Correct. The service governs what case type and work results from intake.","B":"Incorrect. HR service records do not define platform administration.","C":"Incorrect. Those are outside the HR service configuration purpose.","D":"Incorrect. Those technical concerns are unrelated to service fulfillment."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":7,"D":7}},{"id":"CISHR-033","domain":"Core HR Applications and Employee Center","topic":"Catalog category vs COE","difficulty":"Foundation","question":"An HR catalog item appears under Benefits in Employee Center. What follows about its COE?","options":{"A":"It must use the Benefits COE extension table","B":"Its COE cannot be inferred from the catalog category alone","C":"It must have the same topic detail as that category","D":"It must be assigned to the Benefits HR agent group"},"correct_answer":"B","explanations":{"A":"Incorrect. Catalog labels do not mandate COE classification.","B":"Correct. Employee catalog categories and HR service COEs are independent.","C":"Incorrect. COE topic detail is a separate categorization level.","D":"Incorrect. Catalog placement does not force assignment ownership."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":8,"B":10,"C":10,"D":10}},{"id":"CISHR-034","domain":"HR System Architecture","topic":"HR service purpose","difficulty":"Intermediate","question":"What does an HR service principally define?","options":{"A":"The staffing hierarchy of the HR department","B":"The user interface theme for the employee portal","C":"The request-to-fulfillment process for a case type","D":"The encryption key applied to case attachments"},"correct_answer":"C","explanations":{"A":"Incorrect. Organization structures are maintained separately from services.","B":"Incorrect. Portal branding is configured separately from HR fulfillment.","C":"Correct. HR services define the assistance and fulfillment provided by HR.","D":"Incorrect. Data encryption is managed through platform security controls."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":7,"D":7}},{"id":"CISHR-035","domain":"Platform, Role, and Contextual Security","topic":"HR case reader","difficulty":"Advanced","question":"In an HRSD implementation review, how should the HR case reader capability be treated in a security design?","options":{"A":"As permission to bypass every contextual restriction","B":"As an Employee Center branding configuration option","C":"As an automatic assignment rule for HR agents","D":"As part of a broader design with COE policy evaluation"},"correct_answer":"D","explanations":{"A":"Incorrect. Case-reader capability does not justify blanket bypass assumptions.","B":"Incorrect. Case reader is not a portal style setting.","C":"Incorrect. Access rights are different from assignment matching.","D":"Correct. Case-reader access and COE policy configuration interact."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":8,"D":10}},{"id":"CISHR-036","domain":"HR System Architecture","topic":"HR case vs service","difficulty":"Foundation","question":"In an HRSD implementation review, how do an HR service and an HR case differ?","options":{"A":"The service defines fulfillment; a case tracks one request","B":"The case defines configuration; the service stores employees","C":"The case is a role; the service is a security group","D":"The service stores attachments; the case defines portal style"},"correct_answer":"A","explanations":{"A":"Correct. The service is configuration and the case is an individual record.","B":"Incorrect. This reverses the purpose of each record.","C":"Incorrect. Neither artifact is fundamentally an access role.","D":"Incorrect. Neither statement identifies the actual primary purpose."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":2,"option_lengths_words":{"A":9,"B":8,"C":11,"D":9}},{"id":"CISHR-037","domain":"Platform, Role, and Contextual Security","topic":"HR administration","difficulty":"Intermediate","question":"In an HRSD implementation review, who should receive high-privilege HR administration capabilities?","options":{"A":"Any user who reads an HR knowledge article","B":"All employees submitting at least one HR request","C":"All people named as subjects on HR cases","D":"Only authorized staff responsible for HR configuration"},"correct_answer":"D","explanations":{"A":"Incorrect. Knowledge readership does not confer administrative authority.","B":"Incorrect. Requester activity is not a basis for admin rights.","C":"Incorrect. Being the subject does not confer configuration authority.","D":"Correct. Administrative access should follow responsibilities and least privilege."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":8,"D":7}},{"id":"CISHR-038","domain":"Platform, Role, and Contextual Security","topic":"COE policy conditions","difficulty":"Advanced","question":"In an HRSD implementation review, why can conditions on HR COE security policies be useful?","options":{"A":"They restrict permissions to records matching defined criteria","B":"They remove the need for all HR roles and groups","C":"They publish every confidential HR service in the catalog","D":"They replace all platform ACL evaluation automatically"},"correct_answer":"A","explanations":{"A":"Correct. Conditions help refine access by case context.","B":"Incorrect. Access design still uses roles and group membership.","C":"Incorrect. Security conditions do not make services employee-facing.","D":"Incorrect. Conditions do not mean every other control disappears."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":10,"C":9,"D":7}},{"id":"CISHR-039","domain":"Platform, Role, and Contextual Security","topic":"Policy filters","difficulty":"Foundation","question":"What is a potential trade-off of complex COE security policy conditions?","options":{"A":"They always improve performance regardless of complexity","B":"They can affect system performance during access checks","C":"They eliminate the need for HR service configuration","D":"They automatically activate every inactive COE"},"correct_answer":"B","explanations":{"A":"Incorrect. Condition evaluation can add processing cost.","B":"Correct. The documentation warns that conditions should be used cautiously.","C":"Incorrect. Security logic does not replace fulfillment design.","D":"Incorrect. Policy complexity does not govern plugin or COE activation."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":8,"D":6}},{"id":"CISHR-040","domain":"HR System Architecture","topic":"COE organization","difficulty":"Intermediate","question":"How should an implementer categorize HR services within a COE?","options":{"A":"Use assignment group and assigned agent","B":"Use employee department and cost center","C":"Use HR topic category and HR topic detail","D":"Use catalog category and catalog subcategory"},"correct_answer":"C","explanations":{"A":"Incorrect. Assignment fields route work but do not define service taxonomy.","B":"Incorrect. Employee organizational fields do not establish the COE category structure.","C":"Correct. These provide first- and second-level HR service categorization.","D":"Incorrect. Catalog taxonomy is employee-facing and separate from COE categorization."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-centers-of-excellence-coes.html","concept_variant":1,"option_lengths_words":{"A":6,"B":6,"C":8,"D":6}},{"id":"CISHR-041","domain":"Core HR Applications and Employee Center","topic":"Lifecycle notification","difficulty":"Advanced","question":"In an HRSD implementation review, a lifecycle event activity needs to send an email. Which supporting artifact is appropriate?","options":{"A":"An unrelated IT incident form layout","B":"An email notification template for that activity","C":"A second catalog category with the same title","D":"An additional HR case inheritance table"},"correct_answer":"B","explanations":{"A":"Incorrect. Incident layout does not define the lifecycle notification.","B":"Correct. The activity's notification uses a configured email template.","C":"Incorrect. A category is not a notification mechanism.","D":"Incorrect. A new table is not required merely for email content."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":6,"B":7,"C":8,"D":6}},{"id":"CISHR-042","domain":"Core HR Applications and Employee Center","topic":"Lifecycle Event association","difficulty":"Foundation","question":"In an HRSD implementation review, which field connects a lifecycle-event HR service to its event?","options":{"A":"Agent workspace theme","B":"Catalog display category","C":"Knowledge article author","D":"Lifecycle event type"},"correct_answer":"D","explanations":{"A":"Incorrect. Workspace theming does not select lifecycle event fulfillment.","B":"Incorrect. Catalog categories organize presentation rather than fulfillment events.","C":"Incorrect. Article authors do not identify lifecycle event configurations.","D":"Correct. The selected event defines which lifecycle event fulfills the service."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":3,"B":3,"C":3,"D":3}},{"id":"CISHR-043","domain":"HR System Architecture","topic":"Employee-facing categories","difficulty":"Intermediate","question":"In an HRSD implementation review, an HR catalog category is renamed. What does that necessarily change?","options":{"A":"The catalog organization employees navigate","B":"The COE of each related HR service record","C":"The extension table of all associated HR cases","D":"The access control list on each HR case"},"correct_answer":"A","explanations":{"A":"Correct. Catalog categorization is separate from HR COE classification.","B":"Incorrect. The catalog taxonomy is independent of COE taxonomy.","C":"Incorrect. A label change does not change the underlying case table.","D":"Incorrect. A catalog label does not by itself alter ACLs."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":5,"B":8,"C":8,"D":8}},{"id":"CISHR-044","domain":"HR System Architecture","topic":"Assignment workload","difficulty":"Advanced","question":"Which factor contributes to the least-loaded HR agent selection?","options":{"A":"Their catalog items published during the quarter","B":"Their total knowledge articles read this month","C":"Their active HR cases and active HR tasks","D":"Their employee portal sign-ins for the week"},"correct_answer":"C","explanations":{"A":"Incorrect. Catalog administration activity is not case load.","B":"Incorrect. Knowledge consumption does not define HR assignment load.","C":"Correct. Documented load calculations include both active record types.","D":"Incorrect. Portal sessions are not active HR assignment workload."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":8,"D":7}},{"id":"CISHR-045","domain":"Platform, Role, and Contextual Security","topic":"COE security policy","difficulty":"Foundation","question":"In an HRSD implementation review, what is the purpose of an HR COE security policy?","options":{"A":"Set the default employee notification language","B":"Select the country used for HR agent assignment","C":"Define access to sensitive COE case records","D":"Choose the employee portal's navigation categories"},"correct_answer":"C","explanations":{"A":"Incorrect. Language selection is not COE record security.","B":"Incorrect. Routing selection is separate from case permissions.","C":"Correct. COE security policies govern which groups can read or write cases.","D":"Incorrect. Catalog navigation is not case-level access control."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":6,"B":8,"C":7,"D":6}},{"id":"CISHR-046","domain":"Platform, Role, and Contextual Security","topic":"Employee self-service","difficulty":"Intermediate","question":"An employee can request an HR service. Which access conclusion is justified?","options":{"A":"The employee becomes an HR case administrator for that COE","B":"The employee can bypass read ACLs during submission","C":"The employee can now see all cases under the same COE","D":"Request permission does not imply access to unrelated HR cases"},"correct_answer":"D","explanations":{"A":"Incorrect. Self-service permission does not imply administrator rights.","B":"Incorrect. Submission does not inherently bypass ACL enforcement.","C":"Incorrect. Service request access is not universal COE data access.","D":"Correct. Catalog eligibility and case read authorization are separate."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":10,"B":8,"C":11,"D":10}},{"id":"CISHR-047","domain":"Core HR Applications and Employee Center","topic":"HR catalog publication","difficulty":"Advanced","question":"What is the direct operational effect of publishing an HR catalog item?","options":{"A":"Every employee receives an HR administrator role","B":"Every HR service becomes available without criteria","C":"Employees can request the offering through the HR catalog","D":"Every related HR case becomes publicly readable"},"correct_answer":"C","explanations":{"A":"Incorrect. Publication does not authorize administrative access.","B":"Incorrect. Publishing an item does not erase eligibility constraints.","C":"Correct. Published items provide the employee-facing request route.","D":"Incorrect. Publishing a request form does not remove case security."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":9,"D":7}},{"id":"CISHR-048","domain":"Core HR Applications and Employee Center","topic":"HR case template","difficulty":"Foundation","question":"In an HRSD implementation review, a newly opened payroll case needs consistent defaults. What should configure them?","options":{"A":"A second payroll COE table for each employee","B":"An HR case template associated with the service","C":"An Employee Center branding rule for payroll pages","D":"An unrelated article template from the knowledge base"},"correct_answer":"B","explanations":{"A":"Incorrect. Additional tables are not needed for simple defaults.","B":"Correct. Templates populate configured fields when cases are created.","C":"Incorrect. Branding does not establish HR case field defaults.","D":"Incorrect. Article authoring templates do not set case fields."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/configure-hr-case-template.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}},{"id":"CISHR-049","domain":"HR System Architecture","topic":"HR internal services","difficulty":"Intermediate","question":"What is appropriate for an HR service that agents initiate internally?","options":{"A":"Configure the HR service and its HR case template","B":"Create a public record producer for every internal service","C":"Create a portal category without defining a service","D":"Create an IT incident template in place of HR service"},"correct_answer":"A","explanations":{"A":"Correct. Internal-only services need not be presented as a record producer.","B":"Incorrect. Public presentation is not needed for internal-only services.","C":"Incorrect. Catalog organization alone does not produce an HR case.","D":"Incorrect. An IT incident template does not define an HR service."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":9,"B":9,"C":8,"D":10}},{"id":"CISHR-050","domain":"HR System Architecture","topic":"Assignment groups","difficulty":"Advanced","question":"When different countries have separate HR fulfillment teams, what should guide group routing?","options":{"A":"Duplicate the employee's HR profile for each local team","B":"Use appropriate assignment rules based on employee context","C":"Use a single unrestricted group with every employee as member","D":"Change the HR case's parent table for each country"},"correct_answer":"B","explanations":{"A":"Incorrect. Duplicate profiles do not solve routing criteria.","B":"Correct. Rules can select location-specific HR groups for eligible cases.","C":"Incorrect. Employee-wide groups undermine HR fulfillment boundaries.","D":"Incorrect. Table inheritance is not the normal routing mechanism."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":9,"B":8,"C":10,"D":9}},{"id":"CISHR-051","domain":"HR System Architecture","topic":"Scoped customization","difficulty":"Foundation","question":"In an HRSD implementation review, a developer needs to customize HR matching behavior. What aligns with ServiceNow guidance?","options":{"A":"Replace HR case tables with unrelated IT task tables","B":"Disable all HR scopes before adding assignment logic","C":"Modify the underlying assignment utility without controls","D":"Extend behavior through the supported HR assignment API"},"correct_answer":"D","explanations":{"A":"Incorrect. Replacing the record model is unnecessary for matching.","B":"Incorrect. Removing application isolation is not a supported customization plan.","C":"Incorrect. Direct utility modification can increase upgrade risk.","D":"Correct. The documented wrapper limits changes to underlying utilities."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":9,"B":8,"C":7,"D":8}},{"id":"CISHR-052","domain":"Platform, Role, and Contextual Security","topic":"HR data exposure","difficulty":"Intermediate","question":"A developer hides a sensitive case field on the form. What is still required?","options":{"A":"Enforce appropriate server-side record and field access","B":"Assume hidden fields cannot be retrieved through APIs","C":"Rename the HR catalog category to Confidential","D":"Change the portal menu order to hide the case type"},"correct_answer":"A","explanations":{"A":"Correct. Interface hiding is not equivalent to a security rule.","B":"Incorrect. UI layout alone does not ensure server-side protection.","C":"Incorrect. A label does not establish data access control.","D":"Incorrect. Menu order does not enforce record authorization."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":7,"D":10}},{"id":"CISHR-053","domain":"Core HR Applications and Employee Center","topic":"New HR catalog item","difficulty":"Advanced","question":"In an HRSD implementation review, what happens when a new HR catalog item is created as documented?","options":{"A":"A new COE extension table is always created","B":"A new HR employee record is always inserted","C":"A new scoped application is created for the item","D":"A corresponding HR service is created automatically"},"correct_answer":"D","explanations":{"A":"Incorrect. COE case tables are not generated for every item.","B":"Incorrect. Publishing services does not create new employees.","C":"Incorrect. Catalog items live within the existing application model.","D":"Correct. New item creation establishes its associated HR service."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":9,"D":7}},{"id":"CISHR-054","domain":"Platform, Role, and Contextual Security","topic":"COE policy rights","difficulty":"Foundation","question":"In an HRSD implementation review, which access rights can COE security policies configure?","options":{"A":"Agent certification level and learning plans","B":"Database server capacity and storage quotas","C":"Read and write privileges for relevant HR groups","D":"Company-wide portal branding and color settings"},"correct_answer":"C","explanations":{"A":"Incorrect. Learning credentials are outside COE security configuration.","B":"Incorrect. Infrastructure controls are not COE security policy rights.","C":"Correct. Policies can define groups permitted to read or write case records.","D":"Incorrect. Visual presentation is not governed by COE case policies."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":6,"B":6,"C":8,"D":6}},{"id":"CISHR-055","domain":"Core HR Applications and Employee Center","topic":"Activity container","difficulty":"Intermediate","question":"What is an activity container in lifecycle event configuration?","options":{"A":"A grouping mechanism for related event activities","B":"A replacement for all HR service records","C":"A new COE table created by every lifecycle event","D":"A system-wide role that grants employee case access"},"correct_answer":"A","explanations":{"A":"Correct. Containers organize activities within the event framework.","B":"Incorrect. Containers do not eliminate required service configurations.","C":"Incorrect. Containers do not define HR table inheritance.","D":"Incorrect. Containers are not security roles."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":9,"D":8}},{"id":"CISHR-056","domain":"Core HR Applications and Employee Center","topic":"Lifecycle incident activity","difficulty":"Advanced","question":"An event needs an Incident activity for IT fulfillment. What setup is appropriate?","options":{"A":"Replace all HR task activities with new catalog pages","B":"Provide an incident template for the activity","C":"Change the employee HR profile table into Incident","D":"Disable the lifecycle event's employee audiences"},"correct_answer":"B","explanations":{"A":"Incorrect. HR tasks and catalog pages serve different purposes.","B":"Correct. Incident activities can use configured incident templates.","C":"Incorrect. The employee master record is not converted to an incident.","D":"Incorrect. Audience settings do not create the needed incident artifact."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":9,"B":7,"C":8,"D":6}},{"id":"CISHR-057","domain":"Core HR Applications and Employee Center","topic":"HR case template","difficulty":"Foundation","question":"A newly opened payroll case needs consistent defaults. What should configure them?","options":{"A":"An Employee Center branding rule for payroll pages","B":"An unrelated article template from the knowledge base","C":"An HR case template associated with the service","D":"A second payroll COE table for each employee"},"correct_answer":"C","explanations":{"A":"Incorrect. Branding does not establish HR case field defaults.","B":"Incorrect. Article authoring templates do not set case fields.","C":"Correct. Templates populate configured fields when cases are created.","D":"Incorrect. Additional tables are not needed for simple defaults."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/configure-hr-case-template.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}},{"id":"CISHR-058","domain":"Platform, Role, and Contextual Security","topic":"Selective services","difficulty":"Intermediate","question":"In an HRSD implementation review, a COE policy targets selected HR services. What special behavior does the documentation note?","options":{"A":"Unselected services are automatically moved into Payroll","B":"Unselected services are always deleted from the catalog","C":"Unselected services stop generating HR cases immediately","D":"Unselected services may remain accessible to the case reader"},"correct_answer":"D","explanations":{"A":"Incorrect. Policy coverage does not change a service's COE.","B":"Incorrect. Policy selection does not remove catalog configurations.","C":"Incorrect. A security policy is not a case-generation switch.","D":"Correct. Selected-service coverage does not imply all other services are protected."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":7,"B":8,"C":7,"D":9}},{"id":"CISHR-059","domain":"Platform, Role, and Contextual Security","topic":"Group membership","difficulty":"Advanced","question":"In an HRSD implementation review, what is the security concern with placing unrelated agents into a restricted HR group?","options":{"A":"They may inherit access beyond their responsibilities","B":"Their portal homepages may use the same company color","C":"Their employee profiles are duplicated by the platform","D":"Their HR cases automatically change COE classification"},"correct_answer":"A","explanations":{"A":"Correct. Group-based case policies rely on carefully controlled membership.","B":"Incorrect. Shared branding is not the material security concern.","C":"Incorrect. Group membership does not ordinarily clone profiles.","D":"Incorrect. Membership alone does not reclassify existing cases."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":7,"B":9,"C":8,"D":7}},{"id":"CISHR-060","domain":"Core HR Applications and Employee Center","topic":"Agent assignment skills","difficulty":"Foundation","question":"In an HRSD implementation review, why assign skills to members of an HR fulfillment group?","options":{"A":"To determine the color of HR catalog item cards","B":"To enable skill-qualified case and task matching","C":"To replace the subject person on every HR case","D":"To grant the employee self-service administrator role"},"correct_answer":"B","explanations":{"A":"Incorrect. Catalog visual styling is separate from agent qualifications.","B":"Correct. Required skills help identify suitable agents for HR work.","C":"Incorrect. Agent expertise does not identify the case's subject.","D":"Incorrect. Agent skills are not equivalent to administrative roles."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":9,"B":7,"C":9,"D":7}},{"id":"CISHR-061","domain":"HR System Architecture","topic":"HR templates","difficulty":"Intermediate","question":"In an HRSD implementation review, why associate an HR case template with an HR service?","options":{"A":"To create the employee profile at every submission","B":"To assign every HR case to the same administrator","C":"To replace the HR service with an IT request","D":"To populate case fields automatically at creation"},"correct_answer":"D","explanations":{"A":"Incorrect. A case template is not an employee profile import.","B":"Incorrect. A template may include assignment, but not all cases must share one administrator.","C":"Incorrect. Templates do not redefine the HR case application.","D":"Correct. The template provides default values for new HR cases."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/configure-hr-case-template.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":9,"D":7}},{"id":"CISHR-062","domain":"Platform, Role, and Contextual Security","topic":"Policy service selection","difficulty":"Advanced","question":"A COE security policy protects only two selected services. What should the team review?","options":{"A":"Whether the employee portal logo displays correctly","B":"Whether access to the unselected services is acceptable","C":"Whether the HR service catalog has two categories","D":"Whether all HR agents have an IT incident license"},"correct_answer":"B","explanations":{"A":"Incorrect. Portal appearance does not verify service-level protection.","B":"Correct. The documented selection behavior can leave other services accessible.","C":"Incorrect. Catalog category count does not establish policy coverage.","D":"Incorrect. Incident licensing is unrelated to policy coverage."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":8,"D":9}},{"id":"CISHR-063","domain":"Platform, Role, and Contextual Security","topic":"Security group targeting","difficulty":"Foundation","question":"Why use separate HR groups for highly sensitive fulfillment?","options":{"A":"All HR groups must contain every employee in the company","B":"Separate groups replace every HR service configuration record","C":"Different group access policies can protect sensitive cases","D":"Group separation automatically creates new employee profiles"},"correct_answer":"C","explanations":{"A":"Incorrect. General membership would weaken case confidentiality.","B":"Incorrect. Groups control fulfillment and access, not service existence.","C":"Correct. Group separation helps implement least-privilege case handling.","D":"Incorrect. Access groups do not ordinarily create HR profiles."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":10,"B":8,"C":8,"D":7}},{"id":"CISHR-064","domain":"Core HR Applications and Employee Center","topic":"HR workspace","difficulty":"Intermediate","question":"In an HRSD implementation review, who primarily uses the HR Service Delivery Agent Workspace?","options":{"A":"HR agents managing and fulfilling employee requests","B":"Anonymous users reviewing all protected HR cases","C":"Every employee browsing only public catalog offerings","D":"Only database administrators managing schema changes"},"correct_answer":"A","explanations":{"A":"Correct. Agent Workspace supports HR case work and related processes.","B":"Incorrect. Confidential HR case handling is access-controlled.","C":"Incorrect. Employee Center is the employee-facing experience.","D":"Incorrect. Agent Workspace is not limited to schema administration."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":7,"D":6}},{"id":"CISHR-065","domain":"Platform, Role, and Contextual Security","topic":"COE policy storage","difficulty":"Advanced","question":"Where are HR COE security policy definitions stored?","options":{"A":"The sn_hr_core_coe_security_policy table","B":"The sc_cat_item employee catalog table","C":"The kb_knowledge content article table","D":"The sys_user employee identity table"},"correct_answer":"A","explanations":{"A":"Correct. The COE ACL configuration uses this dedicated policy table.","B":"Incorrect. Catalog item records do not store COE security policies.","C":"Incorrect. Knowledge content tables do not store HR COE policies.","D":"Incorrect. User identity records are not COE policy definitions."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":3,"B":5,"C":5,"D":5}},{"id":"CISHR-066","domain":"HR System Architecture","topic":"Assignment fallback","difficulty":"Foundation","question":"When no agent satisfies the country-and-skills match, what is typically tried next?","options":{"A":"An unconditional assignment to the instance admin","B":"A matching rule based only on portal theme","C":"A matching rule based on required skills alone","D":"An automatic closure of the HR case request"},"correct_answer":"C","explanations":{"A":"Incorrect. The admin is not the automatic documented fallback.","B":"Incorrect. Portal branding does not participate in agent matching.","C":"Correct. The default secondary rule relaxes the country condition.","D":"Incorrect. An assignment miss does not imply case resolution."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":8,"D":8}},{"id":"CISHR-067","domain":"Platform, Role, and Contextual Security","topic":"Contextual security","difficulty":"Intermediate","question":"In an HRSD implementation review, why is contextual HR security needed in addition to a broad HR role?","options":{"A":"All HR agents should have identical access to every case","B":"Different cases may require access based on their context","C":"Portal styling is sufficient protection for case records","D":"Every HR case should be searchable by anonymous users"},"correct_answer":"B","explanations":{"A":"Incorrect. Uniform unrestricted access is often inappropriate.","B":"Correct. Sensitive HR records need fine-grained authorization.","C":"Incorrect. Visual hiding cannot replace enforced data access.","D":"Incorrect. Confidential employee information must be protected."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":10,"B":9,"C":8,"D":9}},{"id":"CISHR-068","domain":"Core HR Applications and Employee Center","topic":"HR service vs task","difficulty":"Advanced","question":"Why might an HR case contain multiple HR tasks?","options":{"A":"Each task must create its own new employee profile","B":"Each task publishes a new catalog item automatically","C":"Each task changes the COE parent table of the case","D":"Different fulfillment activities contribute to one request"},"correct_answer":"D","explanations":{"A":"Incorrect. Tasks do not inherently require duplicate profiles.","B":"Incorrect. Case fulfillment does not imply catalog publishing.","C":"Incorrect. Tasks do not alter the case inheritance hierarchy.","D":"Correct. Tasks break down work while the case remains the parent."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":9,"B":8,"C":10,"D":7}},{"id":"CISHR-069","domain":"Core HR Applications and Employee Center","topic":"Lifecycle HR service path","difficulty":"Foundation","question":"In an HRSD implementation review, where does the documented lifecycle-event HR service setup begin?","options":{"A":"System Definition > Dictionary > Tables Only","B":"Service Catalog > Cart > Submitted Requests","C":"HR Administration > HR Services > HR Service Configuration","D":"System Logs > Email > Outbound Queue"},"correct_answer":"C","explanations":{"A":"Incorrect. Dictionary navigation is not the stated HR service procedure.","B":"Incorrect. Employee carts are not the HR service setup area.","C":"Correct. The configuration record links the HR service to the event.","D":"Incorrect. Outbound email logs do not configure HR services."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":9,"D":7}},{"id":"CISHR-070","domain":"Platform, Role, and Contextual Security","topic":"Selective services","difficulty":"Intermediate","question":"A COE policy targets selected HR services. What special behavior does the documentation note?","options":{"A":"Unselected services stop generating HR cases immediately","B":"Unselected services may remain accessible to the case reader","C":"Unselected services are always deleted from the catalog","D":"Unselected services are automatically moved into Payroll"},"correct_answer":"B","explanations":{"A":"Incorrect. A security policy is not a case-generation switch.","B":"Correct. Selected-service coverage does not imply all other services are protected.","C":"Incorrect. Policy selection does not remove catalog configurations.","D":"Incorrect. Policy coverage does not change a service's COE."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":7,"B":9,"C":8,"D":7}},{"id":"CISHR-071","domain":"Core HR Applications and Employee Center","topic":"Journey-linked service","difficulty":"Advanced","question":"In Australia release documentation, which fulfillment type is used for an HR service tied to a Lifecycle Event?","options":{"A":"Manual Fulfillment","B":"Document Publishing","C":"Employee Portal","D":"Lifecycle Event"},"correct_answer":"D","explanations":{"A":"Incorrect. Manual processing does not invoke the configured lifecycle event.","B":"Incorrect. Publishing documents alone does not start the lifecycle event.","C":"Incorrect. A portal is the request channel, not the fulfillment type.","D":"Correct. The lifecycle event is selected as the service's fulfillment type."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":2,"B":2,"C":2,"D":2}},{"id":"CISHR-072","domain":"Platform, Role, and Contextual Security","topic":"HR administration","difficulty":"Foundation","question":"Who should receive high-privilege HR administration capabilities?","options":{"A":"Only authorized staff responsible for HR configuration","B":"Any user who reads an HR knowledge article","C":"All people named as subjects on HR cases","D":"All employees submitting at least one HR request"},"correct_answer":"A","explanations":{"A":"Correct. Administrative access should follow responsibilities and least privilege.","B":"Incorrect. Knowledge readership does not confer administrative authority.","C":"Incorrect. Being the subject does not confer configuration authority.","D":"Incorrect. Requester activity is not a basis for admin rights."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":8,"D":8}},{"id":"CISHR-073","domain":"Platform, Role, and Contextual Security","topic":"Delegated development","difficulty":"Intermediate","question":"In an HRSD implementation review, what is the purpose of delegated development in a scoped application?","options":{"A":"Change catalog categories to match employee departments","B":"Remove the requirement for all application security policies","C":"Grant all employees access to every HR case","D":"Permit designated developers to work within controlled scope"},"correct_answer":"D","explanations":{"A":"Incorrect. Catalog categorization is not delegated development.","B":"Incorrect. Delegation does not nullify authorization constraints.","C":"Incorrect. Scoped development access does not grant universal HR data access.","D":"Correct. Delegated development grants limited application development capability."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":7,"B":8,"C":8,"D":8}},{"id":"CISHR-074","domain":"Platform, Role, and Contextual Security","topic":"COE policy rights","difficulty":"Advanced","question":"Which access rights can COE security policies configure?","options":{"A":"Company-wide portal branding and color settings","B":"Database server capacity and storage quotas","C":"Read and write privileges for relevant HR groups","D":"Agent certification level and learning plans"},"correct_answer":"C","explanations":{"A":"Incorrect. Visual presentation is not governed by COE case policies.","B":"Incorrect. Infrastructure controls are not COE security policy rights.","C":"Correct. Policies can define groups permitted to read or write case records.","D":"Incorrect. Learning credentials are outside COE security configuration."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":6,"B":6,"C":8,"D":6}},{"id":"CISHR-075","domain":"Platform, Role, and Contextual Security","topic":"Role design","difficulty":"Foundation","question":"In an HRSD implementation review, which access approach best protects confidential HR cases?","options":{"A":"Grant only the roles and case access required for work","B":"Replace all HR security policies with portal categories","C":"Grant every employee all HR administrative permissions","D":"Share privileged HR accounts among every team member"},"correct_answer":"A","explanations":{"A":"Correct. Least privilege limits unnecessary exposure to HR data.","B":"Incorrect. Catalog organization cannot enforce record access.","C":"Incorrect. Broad admin access defeats confidentiality safeguards.","D":"Incorrect. Shared accounts damage traceability and least privilege."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":10,"B":8,"C":7,"D":8}},{"id":"CISHR-076","domain":"Core HR Applications and Employee Center","topic":"Journey-linked service","difficulty":"Intermediate","question":"In an HRSD implementation review, in Australia release documentation, which fulfillment type is used for an HR service tied to a Lifecycle Event?","options":{"A":"Manual Fulfillment","B":"Lifecycle Event","C":"Document Publishing","D":"Employee Portal"},"correct_answer":"B","explanations":{"A":"Incorrect. Manual processing does not invoke the configured lifecycle event.","B":"Correct. The lifecycle event is selected as the service's fulfillment type.","C":"Incorrect. Publishing documents alone does not start the lifecycle event.","D":"Incorrect. A portal is the request channel, not the fulfillment type."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":2,"B":2,"C":2,"D":2}},{"id":"CISHR-077","domain":"Core HR Applications and Employee Center","topic":"HR workspace","difficulty":"Advanced","question":"Who primarily uses the HR Service Delivery Agent Workspace?","options":{"A":"Every employee browsing only public catalog offerings","B":"Anonymous users reviewing all protected HR cases","C":"Only database administrators managing schema changes","D":"HR agents managing and fulfilling employee requests"},"correct_answer":"D","explanations":{"A":"Incorrect. Employee Center is the employee-facing experience.","B":"Incorrect. Confidential HR case handling is access-controlled.","C":"Incorrect. Agent Workspace is not limited to schema administration.","D":"Correct. Agent Workspace supports HR case work and related processes."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":6,"D":7}},{"id":"CISHR-078","domain":"Core HR Applications and Employee Center","topic":"Activity container","difficulty":"Foundation","question":"In an HRSD implementation review, what is an activity container in lifecycle event configuration?","options":{"A":"A system-wide role that grants employee case access","B":"A replacement for all HR service records","C":"A grouping mechanism for related event activities","D":"A new COE table created by every lifecycle event"},"correct_answer":"C","explanations":{"A":"Incorrect. Containers are not security roles.","B":"Incorrect. Containers do not eliminate required service configurations.","C":"Correct. Containers organize activities within the event framework.","D":"Incorrect. Containers do not define HR table inheritance."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":8,"B":7,"C":7,"D":9}},{"id":"CISHR-079","domain":"Core HR Applications and Employee Center","topic":"Skill matching","difficulty":"Intermediate","question":"What should an admin verify when skill-based assignment fails?","options":{"A":"The required skills on the template and relevant agents","B":"The employee's knowledge article reading history","C":"The number of categories shown on the HR portal","D":"The browser zoom setting of the current HR agent"},"correct_answer":"A","explanations":{"A":"Correct. Both case requirements and agent skill records affect eligibility.","B":"Incorrect. Reading history does not populate agent skills.","C":"Incorrect. Catalog display categories do not determine agent skills.","D":"Incorrect. Screen scaling does not affect skill matching."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":9,"B":6,"C":9,"D":9}},{"id":"CISHR-080","domain":"Core HR Applications and Employee Center","topic":"Self-service channel","difficulty":"Advanced","question":"In an HRSD implementation review, where should employees normally find published HR catalog requests?","options":{"A":"The server-side script include editor application","B":"An employee-facing portal such as Employee Center","C":"The internal HR assignment-rule administration list","D":"The System Definition table configuration screen"},"correct_answer":"B","explanations":{"A":"Incorrect. Developer tools are not the self-service channel.","B":"Correct. The HR catalog is accessible through employee self-service.","C":"Incorrect. Routing administration is not an employee catalog.","D":"Incorrect. Employees should not need administrative table access."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":6,"B":7,"C":6,"D":6}},{"id":"CISHR-081","domain":"Platform, Role, and Contextual Security","topic":"Domain separation","difficulty":"Foundation","question":"For domain-separated HR teams, how should assignment groups generally be defined?","options":{"A":"Use one universal global group without checking membership","B":"Ignore domains because HR cases cannot be separated","C":"Use child-domain groups for every parent-domain rule","D":"Use domain-appropriate groups for HR work routing"},"correct_answer":"D","explanations":{"A":"Incorrect. Unrestricted global groups can produce cross-domain exposure.","B":"Incorrect. HRSD includes domain-separation considerations.","C":"Incorrect. Mixing child groups into parent assignments can create access issues.","D":"Correct. ServiceNow recommends aligning HR assignment groups
