t_answer":"D","explanations":{"A":"Incorrect. A failed audience does not expose it publicly.","B":"Incorrect. Skipping an activity does not affect employee master data.","C":"Incorrect. Audience failure does not imply administrative fulfillment.","D":"Correct. Audience evaluation suppresses activities outside their intended population."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":8,"D":5}},{"id":"CISHR-163","domain":"Core HR Applications and Employee Center","topic":"Audience non-match","difficulty":"Intermediate","question":"An employee does not meet the audience condition of a lifecycle event activity. What happens?","options":{"A":"The inapplicable activity is skipped","B":"The activity becomes a public catalog request","C":"The employee's entire HR profile is deleted","D":"The activity is reassigned to the system administrator"},"correct_answer":"A","explanations":{"A":"Correct. Audience evaluation suppresses activities outside their intended population.","B":"Incorrect. A failed audience does not expose it publicly.","C":"Incorrect. Skipping an activity does not affect employee master data.","D":"Incorrect. Audience failure does not imply administrative fulfillment."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":5,"B":7,"C":7,"D":8}},{"id":"CISHR-164","domain":"Platform, Role, and Contextual Security","topic":"Roles vs skills","difficulty":"Advanced","question":"An HR agent has an HR skill but no permission to read a case. What is true?","options":{"A":"Changing the employee's display language grants HR read rights","B":"Skills alone do not grant the necessary data access","C":"Adding another portal category fixes the security error","D":"Any assigned skill overrides all active ACL checks"},"correct_answer":"B","explanations":{"A":"Incorrect. Language changes are not authorization changes.","B":"Correct. Qualifications for assignment are distinct from access authorization.","C":"Incorrect. Catalog organization cannot grant case read rights.","D":"Incorrect. Skill ownership is not a universal permission mechanism."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":9,"B":9,"C":8,"D":8}},{"id":"CISHR-165","domain":"Core HR Applications and Employee Center","topic":"AWA mandatory skills","difficulty":"Foundation","question":"In an HRSD implementation review, what occurs if skills are mandatory and no qualified AWA agent is available?","options":{"A":"The work is converted automatically into a knowledge article","B":"The work is immediately routed to any logged-in employee","C":"The work is permanently removed from the HR system","D":"The work waits until an agent with required skills is available"},"correct_answer":"D","explanations":{"A":"Incorrect. Waiting for assignment does not convert record types.","B":"Incorrect. Employee logins do not override mandatory HR agent skills.","C":"Incorrect. No qualified agent does not delete the work item.","D":"Correct. Mandatory skills prevent routing to unsuitable agents."},"source_url":"https://www.servicenow.com/docs/r/xanadu/employee-service-management/hr-service-delivery/awa-hr-overview.html","concept_variant":2,"option_lengths_words":{"A":9,"B":9,"C":9,"D":11}},{"id":"CISHR-166","domain":"HR System Architecture","topic":"Duplicate record producers","difficulty":"Intermediate","question":"In an HRSD implementation review, what configuration does ServiceNow advise avoiding for one HR service?","options":{"A":"Multiple HR tasks belonging to the same case","B":"Multiple record producers invoking the same service","C":"Multiple assignment rules across unrelated COEs","D":"Multiple articles linked to one HR knowledge base"},"correct_answer":"B","explanations":{"A":"Incorrect. Case fulfillment may legitimately involve several tasks.","B":"Correct. The documented recommendation is not to configure multiple producers for one service.","C":"Incorrect. Rules can be defined per relevant COE or table.","D":"Incorrect. Articles can coexist in the same knowledge base."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":2,"option_lengths_words":{"A":8,"B":7,"C":6,"D":8}},{"id":"CISHR-167","domain":"HR System Architecture","topic":"Application scopes","difficulty":"Advanced","question":"Why is HRSD application scoping significant to an implementer?","options":{"A":"It automatically gives every agent full case access","B":"It changes every employee profile to a catalog record","C":"It defines application boundaries for logic and access","D":"It makes COE classification unnecessary for services"},"correct_answer":"C","explanations":{"A":"Incorrect. Application scope does not replace role and data security.","B":"Incorrect. Profile and catalog data remain different concepts.","C":"Correct. Scoped applications separate resources and control cross-scope usage.","D":"Incorrect. Application boundaries do not replace HR service categories."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":8,"B":9,"C":8,"D":7}},{"id":"CISHR-168","domain":"Core HR Applications and Employee Center","topic":"HR service fulfillment","difficulty":"Foundation","question":"In an HRSD implementation review, what does an HR service configuration primarily connect?","options":{"A":"Request initiation with the intended fulfillment process","B":"Employee portal branding with system database indexing","C":"Knowledge article images with agent login sessions","D":"Company departments with all platform admin roles"},"correct_answer":"A","explanations":{"A":"Correct. The service governs what case type and work results from intake.","B":"Incorrect. Those technical concerns are unrelated to service fulfillment.","C":"Incorrect. Those are outside the HR service configuration purpose.","D":"Incorrect. HR service records do not define platform administration."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":7,"D":7}},{"id":"CISHR-169","domain":"Core HR Applications and Employee Center","topic":"Internal intake","difficulty":"Intermediate","question":"A confidential manager-initiated service should not be employee-facing. What is suitable?","options":{"A":"Allow authorized HR agents to create cases internally","B":"Replace the service with an anonymous knowledge comment","C":"Publish the request for all employees to create freely","D":"Disable HR case creation for the whole organization"},"correct_answer":"A","explanations":{"A":"Correct. Internal-only services can be fulfilled without a catalog item.","B":"Incorrect. Knowledge comments are not a case intake mechanism.","C":"Incorrect. Broad publishing contradicts the confidentiality requirement.","D":"Incorrect. Stopping all intake is disproportionate to one service."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":9,"D":8}},{"id":"CISHR-170","domain":"Core HR Applications and Employee Center","topic":"Lifecycle flow","difficulty":"Advanced","question":"What supporting configuration can a lifecycle event Flow activity reference?","options":{"A":"An Employee Center display category only","B":"A manually typed agent's password","C":"The subject person's current browser homepage","D":"A suitable configured subflow"},"correct_answer":"D","explanations":{"A":"Incorrect. Catalog display categories are not executable subflows.","B":"Incorrect. Passwords are neither required nor appropriate for event flows.","C":"Incorrect. Browser settings do not define event automation.","D":"Correct. Flow activities can invoke subflows used by the event."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":6,"B":5,"C":6,"D":4}},{"id":"CISHR-171","domain":"Core HR Applications and Employee Center","topic":"Multi-country HR","difficulty":"Foundation","question":"What is the most suitable way to route HR cases to local HR groups?","options":{"A":"Use the same agent for all countries regardless of skills","B":"Give all regional employees the HR administrator role","C":"Use rules based on the relevant employee location","D":"Duplicate every HR service for every individual employee"},"correct_answer":"C","explanations":{"A":"Incorrect. Ignoring relevant qualifications is not robust matching.","B":"Incorrect. General administrator access is unnecessary for routing.","C":"Correct. Location-aware routing can direct work to local teams.","D":"Incorrect. Per-person service duplication is excessive and unrelated."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":10,"B":8,"C":8,"D":8}},{"id":"CISHR-172","domain":"Core HR Applications and Employee Center","topic":"Assignment rule applicability","difficulty":"Intermediate","question":"When should an HR assignment rule set the assignment group?","options":{"A":"Whenever an employee changes the portal language","B":"When the group is not already set by the relevant template","C":"Only when the catalog item has no display category","D":"Only when the assigned agent closes the HR case"},"correct_answer":"B","explanations":{"A":"Incorrect. Locale settings do not determine whether a group is set.","B":"Correct. Assignment rules can determine an unpopulated HR group.","C":"Incorrect. Employee catalog grouping is unrelated to group assignment.","D":"Incorrect. Routing typically occurs before fulfillment is completed."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":7,"B":11,"C":9,"D":9}},{"id":"CISHR-173","domain":"Core HR Applications and Employee Center","topic":"Workload matching","difficulty":"Advanced","question":"Two eligible HR agents match a case. What behavior is documented for automatic matching?","options":{"A":"Prefer whichever agent has the longer display name","B":"Prefer the eligible agent with the lower active HR workload","C":"Prefer the agent who owns more knowledge articles","D":"Prefer the agent with the most portal bookmarks"},"correct_answer":"B","explanations":{"A":"Incorrect. Display names are not the documented workload comparator.","B":"Correct. The assignment API sorts eligible agents using active HR work.","C":"Incorrect. Article ownership is not the base matching load metric.","D":"Incorrect. Portal bookmarks are unrelated to case allocation."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":8,"B":10,"C":8,"D":8}},{"id":"CISHR-174","domain":"Platform, Role, and Contextual Security","topic":"Security after transfer","difficulty":"Foundation","question":"In an HRSD implementation review, a case is reclassified from Workforce Administration to Payroll. What should be retested?","options":{"A":"The employee portal logo loaded in the browser","B":"The employee's ability to open an IT incident","C":"The sorting of catalog categories alphabetically","D":"Access under the Payroll COE security policy"},"correct_answer":"D","explanations":{"A":"Incorrect. Visual theme does not verify case authorization.","B":"Incorrect. IT incident submission does not test Payroll case restrictions.","C":"Incorrect. Catalog order is unrelated to case data security.","D":"Correct. The new COE may impose different record permissions."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":6,"D":7}},{"id":"CISHR-175","domain":"HR System Architecture","topic":"Country and skills","difficulty":"Intermediate","question":"In an HRSD implementation review, which matching rule normally precedes the skills-only HR rule?","options":{"A":"The agents-by-manager-hierarchy matching rule","B":"The agents-by-skills-and-country matching rule","C":"The agents-by-catalog-category matching rule","D":"The agents-by-last-login-time matching rule"},"correct_answer":"B","explanations":{"A":"Incorrect. Manager hierarchy is not the stated fallback sequence.","B":"Correct. The country-plus-skills rule has the higher priority.","C":"Incorrect. Employee-facing categories do not define this default pair.","D":"Incorrect. Last login is not the default rule in this matching pair."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":4,"B":4,"C":4,"D":4}},{"id":"CISHR-176","domain":"HR System Architecture","topic":"Application scopes","difficulty":"Advanced","question":"In an HRSD implementation review, why is HRSD application scoping significant to an implementer?","options":{"A":"It changes every employee profile to a catalog record","B":"It automatically gives every agent full case access","C":"It defines application boundaries for logic and access","D":"It makes COE classification unnecessary for services"},"correct_answer":"C","explanations":{"A":"Incorrect. Profile and catalog data remain different concepts.","B":"Incorrect. Application scope does not replace role and data security.","C":"Correct. Scoped applications separate resources and control cross-scope usage.","D":"Incorrect. Application boundaries do not replace HR service categories."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":9,"B":8,"C":8,"D":7}},{"id":"CISHR-177","domain":"HR System Architecture","topic":"HR case options","difficulty":"Foundation","question":"In an HRSD implementation review, where can an implementer choose to bypass automatic assignment for a particular service?","options":{"A":"The case options of the HR service configuration","B":"The system locale associated with the HR agent","C":"The name field of the employee catalog category","D":"The logo settings of the employee portal"},"correct_answer":"A","explanations":{"A":"Correct. Service-level case options can skip automatic assignment.","B":"Incorrect. User locale does not switch service-level assignment.","C":"Incorrect. Catalog labels do not control assignment execution.","D":"Incorrect. Branding cannot disable case assignment logic."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":8,"D":7}},{"id":"CISHR-178","domain":"Platform, Role, and Contextual Security","topic":"Cross-scope review","difficulty":"Intermediate","question":"An HR scoped component calls functionality in another scope. What should be considered?","options":{"A":"Cross-scope application access restrictions and approvals","B":"Only whether the user has a mobile app installed","C":"Only the number of HR catalog items in each category","D":"Only the employee portal's font and background colors"},"correct_answer":"A","explanations":{"A":"Correct. Application scopes impose boundaries on resource usage.","B":"Incorrect. Client app availability does not authorize scoped calls.","C":"Incorrect. Catalog size does not approve cross-scope execution.","D":"Incorrect. Branding does not control scoped application calls."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":6,"B":9,"C":10,"D":8}},{"id":"CISHR-179","domain":"Platform, Role, and Contextual Security","topic":"Group membership","difficulty":"Advanced","question":"What is the security concern with placing unrelated agents into a restricted HR group?","options":{"A":"Their employee profiles are duplicated by the platform","B":"Their HR cases automatically change COE classification","C":"They may inherit access beyond their responsibilities","D":"Their portal homepages may use the same company color"},"correct_answer":"C","explanations":{"A":"Incorrect. Group membership does not ordinarily clone profiles.","B":"Incorrect. Membership alone does not reclassify existing cases.","C":"Correct. Group-based case policies rely on carefully controlled membership.","D":"Incorrect. Shared branding is not the material security concern."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":8,"B":7,"C":7,"D":9}},{"id":"CISHR-180","domain":"Core HR Applications and Employee Center","topic":"Lifecycle incident activity","difficulty":"Foundation","question":"In an HRSD implementation review, an event needs an Incident activity for IT fulfillment. What setup is appropriate?","options":{"A":"Change the employee HR profile table into Incident","B":"Replace all HR task activities with new catalog pages","C":"Disable the lifecycle event's employee audiences","D":"Provide an incident template for the activity"},"correct_answer":"D","explanations":{"A":"Incorrect. The employee master record is not converted to an incident.","B":"Incorrect. HR tasks and catalog pages serve different purposes.","C":"Incorrect. Audience settings do not create the needed incident artifact.","D":"Correct. Incident activities can use configured incident templates."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":6,"D":7}},{"id":"CISHR-181","domain":"HR System Architecture","topic":"HR service purpose","difficulty":"Intermediate","question":"In an HRSD implementation review, what does an HR service principally define?","options":{"A":"The request-to-fulfillment process for a case type","B":"The staffing hierarchy of the HR department","C":"The encryption key applied to case attachments","D":"The user interface theme for the employee portal"},"correct_answer":"A","explanations":{"A":"Correct. HR services define the assistance and fulfillment provided by HR.","B":"Incorrect. Organization structures are maintained separately from services.","C":"Incorrect. Data encryption is managed through platform security controls.","D":"Incorrect. Portal branding is configured separately from HR fulfillment."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":7,"D":8}},{"id":"CISHR-182","domain":"Core HR Applications and Employee Center","topic":"Lifecycle HR service path","difficulty":"Advanced","question":"Where does the documented lifecycle-event HR service setup begin?","options":{"A":"System Logs > Email > Outbound Queue","B":"Service Catalog > Cart > Submitted Requests","C":"System Definition > Dictionary > Tables Only","D":"HR Administration > HR Services > HR Service Configuration"},"correct_answer":"D","explanations":{"A":"Incorrect. Outbound email logs do not configure HR services.","B":"Incorrect. Employee carts are not the HR service setup area.","C":"Incorrect. Dictionary navigation is not the stated HR service procedure.","D":"Correct. The configuration record links the HR service to the event."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":7,"D":9}},{"id":"CISHR-183","domain":"Platform, Role, and Contextual Security","topic":"Policy service selection","difficulty":"Foundation","question":"In an HRSD implementation review, a COE security policy protects only two selected services. What should the team review?","options":{"A":"Whether the HR service catalog has two categories","B":"Whether access to the unselected services is acceptable","C":"Whether the employee portal logo displays correctly","D":"Whether all HR agents have an IT incident license"},"correct_answer":"B","explanations":{"A":"Incorrect. Catalog category count does not establish policy coverage.","B":"Correct. The documented selection behavior can leave other services accessible.","C":"Incorrect. Portal appearance does not verify service-level protection.","D":"Incorrect. Incident licensing is unrelated to policy coverage."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":7,"D":9}},{"id":"CISHR-184","domain":"HR System Architecture","topic":"Assignment groups","difficulty":"Intermediate","question":"In an HRSD implementation review, when different countries have separate HR fulfillment teams, what should guide group routing?","options":{"A":"Duplicate the employee's HR profile for each local team","B":"Use a single unrestricted group with every employee as member","C":"Use appropriate assignment rules based on employee context","D":"Change the HR case's parent table for each country"},"correct_answer":"C","explanations":{"A":"Incorrect. Duplicate profiles do not solve routing criteria.","B":"Incorrect. Employee-wide groups undermine HR fulfillment boundaries.","C":"Correct. Rules can select location-specific HR groups for eligible cases.","D":"Incorrect. Table inheritance is not the normal routing mechanism."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":9,"B":10,"C":8,"D":9}},{"id":"CISHR-185","domain":"Core HR Applications and Employee Center","topic":"Multi-country HR","difficulty":"Advanced","question":"In an HRSD implementation review, what is the most suitable way to route HR cases to local HR groups?","options":{"A":"Duplicate every HR service for every individual employee","B":"Use rules based on the relevant employee location","C":"Use the same agent for all countries regardless of skills","D":"Give all regional employees the HR administrator role"},"correct_answer":"B","explanations":{"A":"Incorrect. Per-person service duplication is excessive and unrelated.","B":"Correct. Location-aware routing can direct work to local teams.","C":"Incorrect. Ignoring relevant qualifications is not robust matching.","D":"Incorrect. General administrator access is unnecessary for routing."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":10,"D":8}},{"id":"CISHR-186","domain":"Platform, Role, and Contextual Security","topic":"COE policy storage","difficulty":"Foundation","question":"In an HRSD implementation review, where are HR COE security policy definitions stored?","options":{"A":"The kb_knowledge content article table","B":"The sys_user employee identity table","C":"The sn_hr_core_coe_security_policy table","D":"The sc_cat_item employee catalog table"},"correct_answer":"C","explanations":{"A":"Incorrect. Knowledge content tables do not store HR COE policies.","B":"Incorrect. User identity records are not COE policy definitions.","C":"Correct. The COE ACL configuration uses this dedicated policy table.","D":"Incorrect. Catalog item records do not store COE security policies."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":5,"B":5,"C":3,"D":5}},{"id":"CISHR-187","domain":"Core HR Applications and Employee Center","topic":"Lifecycle loop risk","difficulty":"Intermediate","question":"What should an implementer avoid when configuring nested lifecycle activities?","options":{"A":"An HR service/event association that triggers itself recursively","B":"HR tasks supporting a single onboarding event","C":"Multiple activity audiences targeting different employees","D":"Using an HR service to launch an employee journey"},"correct_answer":"A","explanations":{"A":"Correct. Matching lifecycle event types can create a problematic loop.","B":"Incorrect. Several HR tasks are normal in lifecycle fulfillment.","C":"Incorrect. Different audiences are an intentional configuration feature.","D":"Incorrect. This is the intended lifecycle service initiation path."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":8,"B":7,"C":6,"D":9}},{"id":"CISHR-188","domain":"HR System Architecture","topic":"Matching engine","difficulty":"Advanced","question":"Which plugin underpins HR matching rules in the documented base system?","options":{"A":"Employee Center for theme customization","B":"Performance Analytics for HR case charting","C":"Resource Matching Engine for HR assignment rules","D":"Knowledge Management for article availability"},"correct_answer":"C","explanations":{"A":"Incorrect. Portal theming does not provide the assignment engine.","B":"Incorrect. Analytics measures work but is not the matching engine.","C":"Correct. The matching-rule plugin supports HR routing and matching.","D":"Incorrect. Knowledge controls content rather than agent assignment."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":5,"B":6,"C":7,"D":5}},{"id":"CISHR-189","domain":"Platform, Role, and Contextual Security","topic":"Sensitive HR data","difficulty":"Foundation","question":"In an HRSD implementation review, what design decision best suits employee relations cases with confidential information?","options":{"A":"Expose the cases through an unrestricted employee catalog","B":"Use appropriate COE access policies and group restrictions","C":"Put sensitive details into a public knowledge article","D":"Assign every case to all employees for collaboration"},"correct_answer":"B","explanations":{"A":"Incorrect. General discovery is not authorization for confidential records.","B":"Correct. Sensitive cases need controlled record and group access.","C":"Incorrect. Public content is inappropriate for personal confidential data.","D":"Incorrect. Employee-wide assignment would compromise privacy."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}},{"id":"CISHR-190","domain":"Core HR Applications and Employee Center","topic":"Skill matching","difficulty":"Intermediate","question":"In an HRSD implementation review, what should an admin verify when skill-based assignment fails?","options":{"A":"The browser zoom setting of the current HR agent","B":"The number of categories shown on the HR portal","C":"The employee's knowledge article reading history","D":"The required skills on the template and relevant agents"},"correct_answer":"D","explanations":{"A":"Incorrect. Screen scaling does not affect skill matching.","B":"Incorrect. Catalog display categories do not determine agent skills.","C":"Incorrect. Reading history does not populate agent skills.","D":"Correct. Both case requirements and agent skill records affect eligibility."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":9,"B":9,"C":6,"D":9}},{"id":"CISHR-191","domain":"HR System Architecture","topic":"Service creation","difficulty":"Advanced","question":"An administrator creates a new employee-facing HR offering. Which route avoids duplicate HR services?","options":{"A":"Create a new HR catalog item with its corresponding service","B":"Create two HR services and bind both to one record producer","C":"Create an HR task without establishing an HR service","D":"Create a knowledge article and use it as the case table"},"correct_answer":"A","explanations":{"A":"Correct. ServiceNow can create the linked service from the new item.","B":"Incorrect. Duplicating the service does not simplify setup.","C":"Incorrect. A standalone task does not define a service request.","D":"Incorrect. Articles are content, not replacements for HR cases."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":1,"option_lengths_words":{"A":10,"B":11,"C":9,"D":11}},{"id":"CISHR-192","domain":"Platform, Role, and Contextual Security","topic":"Reclassification impact","difficulty":"Foundation","question":"In an HRSD implementation review, after an HR case moves to another COE, what security effect is possible?","options":{"A":"The case automatically becomes public to all employees","B":"The HR service catalog is deleted for the entire instance","C":"The employee's profile must always be recreated","D":"An agent may lose access under the new COE policy"},"correct_answer":"D","explanations":{"A":"Incorrect. Changing COE does not imply open public access.","B":"Incorrect. Case classification does not delete the service catalog.","C":"Incorrect. COE reclassification does not require new profiles.","D":"Correct. Reclassification changes the relevant security context."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":10,"C":7,"D":10}},{"id":"CISHR-193","domain":"Platform, Role, and Contextual Security","topic":"Security after transfer","difficulty":"Intermediate","question":"A case is reclassified from Workforce Administration to Payroll. What should be retested?","options":{"A":"Access under the Payroll COE security policy","B":"The employee's ability to open an IT incident","C":"The employee portal logo loaded in the browser","D":"The sorting of catalog categories alphabetically"},"correct_answer":"A","explanations":{"A":"Correct. The new COE may impose different record permissions.","B":"Incorrect. IT incident submission does not test Payroll case restrictions.","C":"Incorrect. Visual theme does not verify case authorization.","D":"Incorrect. Catalog order is unrelated to case data security."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":8,"D":6}},{"id":"CISHR-194","domain":"HR System Architecture","topic":"HR catalog relationship","difficulty":"Advanced","question":"Which relationship between HR services and catalog items is correct?","options":{"A":"Every HR service must have its own catalog item","B":"Every HR catalog item has a corresponding HR service","C":"Every catalog category creates an HR case table","D":"Every HR service must belong to the IT service catalog"},"correct_answer":"B","explanations":{"A":"Incorrect. Internal-only HR services need no catalog presentation.","B":"Correct. Some services are internal-only and have no employee-facing catalog item.","C":"Incorrect. Catalog categories group items rather than create tables.","D":"Incorrect. HR services can be offered in an HR-specific catalog."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":9,"B":9,"C":8,"D":10}},{"id":"CISHR-195","domain":"Core HR Applications and Employee Center","topic":"Rule sequencing","difficulty":"Foundation","question":"In an HRSD implementation review, two HR assignment rules both match a case. Which one should be considered first?","options":{"A":"The matching rule whose name sorts last alphabetically","B":"The matching rule created most recently by an admin","C":"The matching rule assigned to the largest group","D":"The matching rule with the lower execution order"},"correct_answer":"D","explanations":{"A":"Incorrect. The name has no precedence over execution order.","B":"Incorrect. Creation time is not the documented priority mechanism.","C":"Incorrect. Group size does not decide evaluation order.","D":"Correct. Execution order prioritizes the matching logic."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":8,"D":8}},{"id":"CISHR-196","domain":"Core HR Applications and Employee Center","topic":"Audience default","difficulty":"Intermediate","question":"If a lifecycle event activity has no audience record, what is its default applicability?","options":{"A":"The activity is visible only to the system administrator","B":"The activity is skipped for every employee by default","C":"The activity applies to all employees in that event","D":"The activity is converted into an approval automatically"},"correct_answer":"C","explanations":{"A":"Incorrect. An absent audience is not an admin-only setting.","B":"Incorrect. No audience does not mean exclude everyone.","C":"Correct. An unrestricted activity can trigger for every subject person.","D":"Incorrect. Audience membership does not change the activity type."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":9,"B":9,"C":9,"D":8}},{"id":"CISHR-197","domain":"HR System Architecture","topic":"Missing subject person","difficulty":"Advanced","question":"What can happen when an HR case has no subject person selected?","options":{"A":"The catalog item creates a new COE at submission time","B":"Only HR services without HR criteria may appear","C":"Every HR service is automatically visible regardless of criteria","D":"The HR case is converted into an IT incident automatically"},"correct_answer":"B","explanations":{"A":"Incorrect. COEs are not generated by missing employee data.","B":"Correct. The documented case creation filter uses the subject person.","C":"Incorrect. Eligibility filtering is not disabled by missing subject data.","D":"Incorrect. A missing subject does not change the record class."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":1,"option_lengths_words":{"A":10,"B":8,"C":9,"D":10}},{"id":"CISHR-198","domain":"Core HR Applications and Employee Center","topic":"Lifecycle flow","difficulty":"Foundation","question":"In an HRSD implementation review, what supporting configuration can a lifecycle event Flow activity reference?","options":{"A":"An Employee Center display category only","B":"The subject person's current browser homepage","C":"A suitable configured subflow","D":"A manually typed agent's password"},"correct_answer":"C","explanations":{"A":"Incorrect. Catalog display categories are not executable subflows.","B":"Incorrect. Browser settings do not define event automation.","C":"Correct. Flow activities can invoke subflows used by the event.","D":"Incorrect. Passwords are neither required nor appropriate for event flows."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":6,"B":6,"C":4,"D":5}},{"id":"CISHR-199","domain":"Platform, Role, and Contextual Security","topic":"Delegated development","difficulty":"Intermediate","question":"What is the purpose of delegated development in a scoped application?","options":{"A":"Grant all employees access to every HR case","B":"Remove the requirement for all application security policies","C":"Change catalog categories to match employee departments","D":"Permit designated developers to work within controlled scope"},"correct_answer":"D","explanations":{"A":"Incorrect. Scoped development access does not grant universal HR data access.","B":"Incorrect. Delegation does not nullify authorization constraints.","C":"Incorrect. Catalog categorization is not delegated development.","D":"Correct. Delegated development grants limited application development capability."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":7,"D":8}},{"id":"CISHR-200","domain":"Platform, Role, and Contextual Security","topic":"Security verification","difficulty":"Advanced","question":"In an HRSD implementation review, how should restricted HR case permissions be validated?","options":{"A":"Test read and write using representative authorized users","B":"Review only the HR catalog item's display title","C":"Assume a hidden portal link guarantees case protection","D":"Test exclusively while logged in as system administrator"},"correct_answer":"A","explanations":{"A":"Correct. Permission testing must reflect actual roles and context.","B":"Incorrect. A label does not validate actual record access.","C":"Incorrect. Direct data access may still require authorization enforcement.","D":"Incorrect. Admin privileges can conceal ordinary access problems."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}}]</script>
<script>
(()=>{'use strict';
const questions=JSON.parse(document.getElementById('bank').textContent),byId=Object.fromEntries(questions.map(q=>[q.id,q]));
const KEY='cishr-study-v1';let data={attempts:{},bookmarks:{}};
try{let old=JSON.parse(localStorage.getItem(KEY)||'{}');if(old && typeof old==='object'){data.attempts=old.attempts&&typeof old.attempts==='object'?old.attempts:{};data.bookmarks=old.bookmarks&&typeof old.bookmarks==='object'?old.bookmarks:{}}}catch{}
const $=id=>document.getElementById(id),home=$('home'),study=$('study');
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let queue=[],pos=0,answered=null,mode='all',domain='all',order={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch{alert('Unable to save progress. Browser storage may be disabled or full. Export your progress for safekeeping.');return false}}
function stats(){let completed=0,correct=0,mistakes=0;for(let q of questions){let a=data.attempts[q.id];if(a?.total>0){completed++;if(a.lastCorrect)correct++;if(a.wrong>0)mistakes++}}return {completed,correct,mistakes}}
function stat(n,l){return `<div class="stat"><div class="num">${n}</div><div class="muted">${l}</div></div>`}
function renderHome(){const s=stats(),pct=Math.round(s.completed/questions.length*100),accuracy=s.completed?Math.round(s.correct/s.completed*100):0;
home.innerHTML=`<div class="stats">${stat(questions.length,'Total questions')}${stat(s.completed,'Attempted')}${stat(accuracy+'%','Last-attempt accuracy')}${stat(s.mistakes,'Ever missed')}</div><div class="card"><div class="headrow"><h2>Your progress</h2><span class="muted">${s.completed} / ${questions.length}</span></div><div class="bar"><span style="width:${pct}%"></span></div><p class="muted">Progress is saved automatically in this browser. Your mistake history remains even after a later correct answer.</p><div class="section"><h3>Blueprint coverage</h3>${[...new Set(questions.map(x=>x.domain))].map(d=>{let items=questions.filter(x=>x.domain===d),done=items.filter(x=>data.attempts[x.id]?.total>0).length;return `<div class="domain"><span>${safe(d)}</span><div class="bar"><span style="width:${done/items.length*100}%"></span></div><span>${done}/${items.length}</span></div>`}).join('')}</div></div><div class="section"><h2>Practice modes</h2><div class="modes">${[['all','Study all','Review the full bank in a shuffled order.'],['unanswered','Unanswered','Focus on questions you have not yet attempted.'],['mistakes','Review mistakes','Revisit every question you have ever missed.'],['bookmarks','Bookmarked','Practise questions you have marked for later.'],['exam','Mock exam','Take 50 random questions without instant feedback.']].map(([m,n,d])=>`<button class="mode" data-mode="${m}"><b>${n}</b><small>${d}</small></button>`).join('')}</div></div><div class="card section"><h2>Settings and backup</h2><div class="toolbar"><label class="muted" for="filter">Study domain</label><select id="filter"><option value="all">All domains</option>${[...new Set(questions.map(x=>x.domain))].map(d=>`<option value="${safe(d)}" ${domain===d?'selected':''}>${safe(d)}</option>`).join('')}</select></div><div class="toolbar"><button class="btn" id="export">Export progress (JSON)</button><button class="btn" id="import">Import progress (JSON)</button><input id="upload" type="file" accept=".json,application/json" hidden><button class="btn danger" id="reset">Reset progress</button></div><p class="muted">An export contains your answers and bookmarks, not personal information. Import replaces existing browser progress.</p></div><div class="notice section"><b>Study note:</b> This is a preliminary, independently authored bank. Some questions cover overlapping concepts, and technical explanations have not been individually verified against current product documentation. Use linked references to confirm uncertain points.</div>`;
home.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));$('filter').onchange=e=>{domain=e.target.value;renderHome()};$('export').onclick=exportProgress;$('import').onclick=()=>$('upload').click();$('upload').onchange=importProgress;$('reset').onclick=()=>{if(confirm('Delete all saved attempts and bookmarks from this browser? This cannot be undone.')){data={attempts:{},bookmarks:{}};save();renderHome()}}}
function eligible(q,m){let a=data.attempts[q.id];return (domain==='all'||q.domain===domain) && (m==='all'||m==='exam'||(m==='unanswered'&&!a?.total)||(m==='mistakes'&&a?.wrong>0)||(m==='bookmarks'&&data.bookmarks[q.id]))}
function start(m){mode=m;queue=shuffle(questions.filter(q=>eligible(q,m))).map(q=>q.id);if(m==='exam')queue=queue.slice(0,50);pos=0;answered=null;order={};if(!queue.length){alert('No questions match this mode and domain. Change the domain filter or choose another mode.');return}home.classList.add('hidden');study.classList.remove('hidden');renderQuestion()}
function renderQuestion(){if(pos>=queue.length){finish();return}let q=byId[queue[pos]],a=data.attempts[q.id],isExam=mode==='exam',selected=answered;if(!order[q.id])order[q.id]=shuffle(['A','B','C','D']);let reveal=selected!==null&&!isExam;
study.innerHTML=`<div class="controls"><button id="back" class="btn">← Dashboard</button><span class="flex"></span><span class="muted">Question ${pos+1} of ${queue.length}</span></div><div class="bar"><span style="width:${pos/queue.length*100}%"></span></div><article class="card section"><div class="headrow"><span class="tag">${safe(q.domain)} · ${safe(q.difficulty)}</span><button class="btn" id="bookmark">${data.bookmarks[q.id]?'★ Bookmarked':'☆ Bookmark'}</button></div><div class="question">${safe(q.question)}</div><div id="choices">${order[q.id].map((letter,i)=>{let cls=reveal?(letter===q.correct_answer?'good':letter===selected?'bad':''):'';return `<button class="choice ${cls}" data-answer="${letter}" ${selected!==null?'disabled':''}><span class="letter">${i+1}</span><span>${safe(q.options[letter])}</span></button>`}).join('')}</div>${reveal?`<div class="feedback"><h3>${selected===q.correct_answer?'Correct answer':'Incorrect answer'} · ${safe(q.options[q.correct_answer])}</h3>${order[q.id].map(l=>`<div class="explain ${l===q.correct_answer?'correct':''}"><b>${safe(q.options[l])}</b><div>${safe(q.explanations[l])}</div></div>`).join('')}${q.source_url?`<p class="small"><a href="${safe(q.source_url)}" target="_blank" rel="noopener noreferrer">Reference documentation ↗</a> (requires an internet connection)</p>`:''}</div>`:''}<div class="toolbar section"><button id="next" class="btn primary" ${selected===null?'disabled':''}>${pos===queue.length-1?'Finish session':'Next question →'}</button><span class="muted">${a?.total||0} previous attempts · ${a?.wrong||0} misses</span></div></article>`;
$('back').onclick=()=>{home.classList.remove('hidden');study.classList.add('hidden');renderHome()};$('bookmark').onclick=()=>{if(data.bookmarks[q.id])delete data.bookmarks[q.id];else data.bookmarks[q.id]=true;save();renderQuestion()};study.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(b.dataset.answer));$('next').onclick=()=>{pos++;answered=null;renderQuestion()};}
function answer(letter){if(answered!==null)return;answered=letter;const q=byId[queue[pos]],a=data.attempts[q.id]||{total:0,wrong:0,correct:0};a.total++;if(letter===q.correct_answer)a.correct++;else a.wrong++;a.lastCorrect=letter===q.correct_answer;a.lastChoice=letter;a.lastDate=new Date().toISOString();data.attempts[q.id]=a;save();renderQuestion()}
function finish(){let total=queue.length,good=queue.filter(id=>data.attempts[id]?.lastCorrect).length;study.innerHTML=`<div class="card"><h2>Session completed</h2><p>You have reached the end of this question set.</p><div class="stats">${stat(total,'Questions in session')}${stat(good,'Correct on latest attempt')}</div><button class="btn primary" id="return">Return to dashboard</button></div>`;$('return').onclick=()=>{study.classList.add('hidden');home.classList.remove('hidden');renderHome()}}
function exportProgress(){let payload={format:'cishr-study-v1',exportedAt:new Date().toISOString(),data};let blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cishr-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importProgress(e){let file=e.target.files?.[0];e.target.value='';if(!file)return;try{if(file.size>3e6)throw Error('File is too large');let payload=JSON.parse(await file.text());if(payload.format!=='cishr-study-v1'||!payload.data||typeof payload.data.attempts!=='object'||typeof payload.data.bookmarks!=='object'||Array.isArray(payload.data.attempts))throw Error('Not a compatible backup');if(!confirm('Replace your current progress with the imported progress?'))return;let attempts={},bookmarks={};for(let [id,a] of Object.entries(payload.data.attempts)){if(!byId[id]||!a||typeof a!=='object')continue;let total=Number(a.total),wrong=Number(a.wrong),correct=Number(a.correct);if(![total,wrong,correct].every(x=>Number.isSafeInteger(x)&&x>=0)||wrong+correct!==total)continue;attempts[id]={total,wrong,correct,lastCorrect:!!a.lastCorrect,lastChoice:['A','B','C','D'].includes(a.lastChoice)?a.lastChoice:null,lastDate:typeof a.lastDate==='string'?a.lastDate:''}}for(let id of Object.keys(payload.data.bookmarks))if(byId[id]&&payload.data.bookmarks[id])bookmarks[id]=true;data={attempts,bookmarks};save();renderHome();alert('Progress imported successfully.')}catch(err){alert('Unable to import: '+err.message)}}
renderHome();
})();
</script><script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js', {scope: './'}).then(() => navigator.serviceWorker.ready).then(() => { const el=document.getElementById('offline-status'); if(el) el.textContent='● OFFLINE READY'; }).catch(err => console.warn('Offline installation unavailable:', err)));
}
</script></body></html>
