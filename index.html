 to the relevant domain."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-domain-rec.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":7,"D":7}},{"id":"CISHR-082","domain":"HR System Architecture","topic":"COE boundaries","difficulty":"Intermediate","question":"In an HRSD implementation review, which implementation goal is directly supported by separate COE case tables?","options":{"A":"Replacing HR service configuration with catalog categories","B":"Separating sensitive case types and reporting","C":"Sharing every confidential HR case with all employees","D":"Avoiding the need for case assignment entirely"},"correct_answer":"B","explanations":{"A":"Incorrect. COEs do not eliminate request and fulfillment configuration.","B":"Correct. COE structure supports access boundaries and consistent measurement.","C":"Incorrect. COE separation is not an instruction to grant general access.","D":"Incorrect. Cases can still require groups and individual agents."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-centers-of-excellence-coes.html","concept_variant":2,"option_lengths_words":{"A":7,"B":6,"C":8,"D":7}},{"id":"CISHR-083","domain":"Core HR Applications and Employee Center","topic":"Self-service channel","difficulty":"Advanced","question":"Where should employees normally find published HR catalog requests?","options":{"A":"An employee-facing portal such as Employee Center","B":"The server-side script include editor application","C":"The internal HR assignment-rule administration list","D":"The System Definition table configuration screen"},"correct_answer":"A","explanations":{"A":"Correct. The HR catalog is accessible through employee self-service.","B":"Incorrect. Developer tools are not the self-service channel.","C":"Incorrect. Routing administration is not an employee catalog.","D":"Incorrect. Employees should not need administrative table access."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":7,"B":6,"C":6,"D":6}},{"id":"CISHR-084","domain":"Core HR Applications and Employee Center","topic":"No subject specified","difficulty":"Foundation","question":"In an HRSD implementation review, an HR agent cannot see a criterion-restricted service before selecting a subject person. Why?","options":{"A":"The agent loses their platform login when the form opens","B":"The case automatically changes its record type to Incident","C":"Restricted services depend on evaluating that person's criteria","D":"The restricted service must have been permanently deleted"},"correct_answer":"C","explanations":{"A":"Incorrect. Service filtering is distinct from authentication.","B":"Incorrect. Missing subject person does not convert the record type.","C":"Correct. Without the subject, only services lacking criteria are available.","D":"Incorrect. Visibility can vary without any service deletion."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":2,"option_lengths_words":{"A":10,"B":9,"C":8,"D":8}},{"id":"CISHR-085","domain":"HR System Architecture","topic":"Matching engine","difficulty":"Intermediate","question":"In an HRSD implementation review, which plugin underpins HR matching rules in the documented base system?","options":{"A":"Resource Matching Engine for HR assignment rules","B":"Knowledge Management for article availability","C":"Employee Center for theme customization","D":"Performance Analytics for HR case charting"},"correct_answer":"A","explanations":{"A":"Correct. The matching-rule plugin supports HR routing and matching.","B":"Incorrect. Knowledge controls content rather than agent assignment.","C":"Incorrect. Portal theming does not provide the assignment engine.","D":"Incorrect. Analytics measures work but is not the matching engine."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":7,"B":5,"C":5,"D":6}},{"id":"CISHR-086","domain":"Platform, Role, and Contextual Security","topic":"HR data exposure","difficulty":"Advanced","question":"In an HRSD implementation review, a developer hides a sensitive case field on the form. What is still required?","options":{"A":"Rename the HR catalog category to Confidential","B":"Assume hidden fields cannot be retrieved through APIs","C":"Change the portal menu order to hide the case type","D":"Enforce appropriate server-side record and field access"},"correct_answer":"D","explanations":{"A":"Incorrect. A label does not establish data access control.","B":"Incorrect. UI layout alone does not ensure server-side protection.","C":"Incorrect. Menu order does not enforce record authorization.","D":"Correct. Interface hiding is not equivalent to a security rule."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":7,"B":8,"C":10,"D":7}},{"id":"CISHR-087","domain":"Platform, Role, and Contextual Security","topic":"Auditability","difficulty":"Foundation","question":"Why should privileged HR case access be limited to named accounts?","options":{"A":"Named accounts automatically resolve every case faster","B":"Named accounts enable public read access by default","C":"Actions can be associated with accountable individuals","D":"Named accounts eliminate all need for COE policies"},"correct_answer":"C","explanations":{"A":"Incorrect. Individual identity does not guarantee faster fulfillment.","B":"Incorrect. Named accounts do not mean public authorization.","C":"Correct. Individual access supports traceability of sensitive operations.","D":"Incorrect. Identity accountability does not replace record-level permissions."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":7,"D":8}},{"id":"CISHR-088","domain":"Core HR Applications and Employee Center","topic":"Service record producer","difficulty":"Intermediate","question":"In an HRSD implementation review, what role does a record producer serve for an HR self-service offering?","options":{"A":"It grants every requester unrestricted case read access","B":"It captures employee inputs and initiates the HR service","C":"It defines the default encryption algorithm for records","D":"It replaces the COE case table used for fulfillment"},"correct_answer":"B","explanations":{"A":"Incorrect. Submission is not equivalent to reading all cases.","B":"Correct. The producer presents the request and starts the associated case.","C":"Incorrect. Encryption configuration is a different concern.","D":"Incorrect. Record producers do not replace the HR case model."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":8,"D":9}},{"id":"CISHR-089","domain":"Core HR Applications and Employee Center","topic":"HR task parent","difficulty":"Advanced","question":"In an HRSD implementation review, an HR task has a parent case with an eligible assigned agent. Which result is expected?","options":{"A":"The parent case agent can be ranked ahead of other agents","B":"All task matching must ignore the associated HR case","C":"The parent case agent is never eligible for its task","D":"The HR task must be reassigned to the requester"},"correct_answer":"A","explanations":{"A":"Correct. Task matching prioritizes eligible parent-case agent continuity.","B":"Incorrect. The parent case is explicitly checked in task matching.","C":"Incorrect. Matching does not exclude the agent solely due to ownership.","D":"Incorrect. Employee requesters are not automatically task assignees."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":11,"B":9,"C":10,"D":9}},{"id":"CISHR-090","domain":"Core HR Applications and Employee Center","topic":"HR catalog publication","difficulty":"Foundation","question":"In an HRSD implementation review, what is the direct operational effect of publishing an HR catalog item?","options":{"A":"Every related HR case becomes publicly readable","B":"Employees can request the offering through the HR catalog","C":"Every HR service becomes available without criteria","D":"Every employee receives an HR administrator role"},"correct_answer":"B","explanations":{"A":"Incorrect. Publishing a request form does not remove case security.","B":"Correct. Published items provide the employee-facing request route.","C":"Incorrect. Publishing an item does not erase eligibility constraints.","D":"Incorrect. Publication does not authorize administrative access."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":7,"B":9,"C":7,"D":7}},{"id":"CISHR-091","domain":"HR System Architecture","topic":"Assignment priority","difficulty":"Intermediate","question":"In an HRSD implementation review, how are execution-order values interpreted by HR matching rules?","options":{"A":"A higher execution-order number is always evaluated first","B":"Alphabetical rule names determine the first match","C":"A lower execution-order number is evaluated first","D":"The order number is ignored when a group is populated"},"correct_answer":"C","explanations":{"A":"Incorrect. This reverses the documented execution-order semantics.","B":"Incorrect. The documented priority uses execution order, not names.","C":"Correct. Smaller order values receive higher priority in matching.","D":"Incorrect. Matching logic still follows configured rule order."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":8,"B":7,"C":7,"D":10}},{"id":"CISHR-092","domain":"Core HR Applications and Employee Center","topic":"Lifecycle loop risk","difficulty":"Advanced","question":"In an HRSD implementation review, what should an implementer avoid when configuring nested lifecycle activities?","options":{"A":"Multiple activity audiences targeting different employees","B":"HR tasks supporting a single onboarding event","C":"Using an HR service to launch an employee journey","D":"An HR service/event association that triggers itself recursively"},"correct_answer":"D","explanations":{"A":"Incorrect. Different audiences are an intentional configuration feature.","B":"Incorrect. Several HR tasks are normal in lifecycle fulfillment.","C":"Incorrect. This is the intended lifecycle service initiation path.","D":"Correct. Matching lifecycle event types can create a problematic loop."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":6,"B":7,"C":9,"D":8}},{"id":"CISHR-093","domain":"HR System Architecture","topic":"HR service visibility","difficulty":"Foundation","question":"Why might one HR service appear in agent tools but not Employee Center?","options":{"A":"It is configured for internal initiation only","B":"Every HR service must appear on every portal automatically","C":"The HR case parent table has no extensible fields","D":"Employee Center only displays IT incident requests"},"correct_answer":"A","explanations":{"A":"Correct. Not all HR services are exposed as employee catalog items.","B":"Incorrect. Only appropriate published catalog items are surfaced.","C":"Incorrect. Table extension does not determine catalog publication.","D":"Incorrect. Employee Center can present HR service requests."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":7,"B":9,"C":9,"D":7}},{"id":"CISHR-094","domain":"HR System Architecture","topic":"HR task assignment","difficulty":"Intermediate","question":"What preference can the matching logic give when assigning an HR task?","options":{"A":"It must use a user outside the parent case group","B":"It must always assign tasks to the system administrator","C":"It assigns tasks based on catalog item alphabetical order","D":"It can prioritize the agent assigned to its parent case"},"correct_answer":"D","explanations":{"A":"Incorrect. Group exclusion is not the documented default preference.","B":"Incorrect. Automatic task matching does not require administrator assignment.","C":"Incorrect. Catalog sorting is not a task matching rule.","D":"Correct. Parent-case agent continuity can take precedence over load."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":10,"B":9,"C":9,"D":10}},{"id":"CISHR-095","domain":"HR System Architecture","topic":"Record producer fields","difficulty":"Advanced","question":"What can an HR catalog item configuration determine?","options":{"A":"The inheritance chain of every COE case table","B":"The fields collected from employees during submission","C":"The database encryption algorithm for every HR case","D":"The company hierarchy on every user's profile"},"correct_answer":"B","explanations":{"A":"Incorrect. Table inheritance is independent of record producer fields.","B":"Correct. Record producers define the input shown for the service request.","C":"Incorrect. This belongs to platform security configuration.","D":"Incorrect. Organization data is outside catalog item presentation."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":1,"option_lengths_words":{"A":8,"B":7,"C":8,"D":7}},{"id":"CISHR-096","domain":"Core HR Applications and Employee Center","topic":"Catalog category vs COE","difficulty":"Foundation","question":"In an HRSD implementation review, an HR catalog item appears under Benefits in Employee Center. What follows about its COE?","options":{"A":"It must be assigned to the Benefits HR agent group","B":"It must use the Benefits COE extension table","C":"Its COE cannot be inferred from the catalog category alone","D":"It must have the same topic detail as that category"},"correct_answer":"C","explanations":{"A":"Incorrect. Catalog placement does not force assignment ownership.","B":"Incorrect. Catalog labels do not mandate COE classification.","C":"Correct. Employee catalog categories and HR service COEs are independent.","D":"Incorrect. COE topic detail is a separate categorization level."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":10,"B":8,"C":10,"D":10}},{"id":"CISHR-097","domain":"HR System Architecture","topic":"HR case classification","difficulty":"Intermediate","question":"In an HRSD implementation review, how does selecting a COE affect manual HR case creation?","options":{"A":"It automatically grants case access to all HR agents","B":"It chooses the employee portal's branding preset","C":"It removes the need to identify the subject person","D":"It filters the available HR service choices"},"correct_answer":"D","explanations":{"A":"Incorrect. Classification does not bypass security policy.","B":"Incorrect. Portal appearance is independent of COE selection.","C":"Incorrect. Employee context may still be required for eligibility.","D":"Correct. Service offerings are associated with COE classification."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":2,"option_lengths_words":{"A":9,"B":7,"C":9,"D":7}},{"id":"CISHR-098","domain":"Core HR Applications and Employee Center","topic":"HR service vs task","difficulty":"Advanced","question":"In an HRSD implementation review, why might an HR case contain multiple HR tasks?","options":{"A":"Each task publishes a new catalog item automatically","B":"Each task must create its own new employee profile","C":"Different fulfillment activities contribute to one request","D":"Each task changes the COE parent table of the case"},"correct_answer":"C","explanations":{"A":"Incorrect. Case fulfillment does not imply catalog publishing.","B":"Incorrect. Tasks do not inherently require duplicate profiles.","C":"Correct. Tasks break down work while the case remains the parent.","D":"Incorrect. Tasks do not alter the case inheritance hierarchy."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":7,"D":10}},{"id":"CISHR-099","domain":"Core HR Applications and Employee Center","topic":"Internal intake","difficulty":"Foundation","question":"In an HRSD implementation review, a confidential manager-initiated service should not be employee-facing. What is suitable?","options":{"A":"Allow authorized HR agents to create cases internally","B":"Replace the service with an anonymous knowledge comment","C":"Publish the request for all employees to create freely","D":"Disable HR case creation for the whole organization"},"correct_answer":"A","explanations":{"A":"Correct. Internal-only services can be fulfilled without a catalog item.","B":"Incorrect. Knowledge comments are not a case intake mechanism.","C":"Incorrect. Broad publishing contradicts the confidentiality requirement.","D":"Incorrect. Stopping all intake is disproportionate to one service."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":9,"D":8}},{"id":"CISHR-100","domain":"HR System Architecture","topic":"Subject person","difficulty":"Intermediate","question":"In an HRSD implementation review, for service eligibility during HR case creation, whose attributes are relevant?","options":{"A":"The system administrator's department and manager","B":"The selected subject person's attributes and HR criteria","C":"The HR agent's last successful login location","D":"The service owner's preferred workspace theme"},"correct_answer":"B","explanations":{"A":"Incorrect. Administrator profile data does not determine employee eligibility.","B":"Correct. The available services are filtered against the subject person.","C":"Incorrect. Agent login location is not the service eligibility subject.","D":"Incorrect. Interface preferences do not determine subject eligibility."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":2,"option_lengths_words":{"A":6,"B":8,"C":7,"D":6}},{"id":"CISHR-101","domain":"Core HR Applications and Employee Center","topic":"Service record producer","difficulty":"Advanced","question":"What role does a record producer serve for an HR self-service offering?","options":{"A":"It defines the default encryption algorithm for records","B":"It grants every requester unrestricted case read access","C":"It captures employee inputs and initiates the HR service","D":"It replaces the COE case table used for fulfillment"},"correct_answer":"C","explanations":{"A":"Incorrect. Encryption configuration is a different concern.","B":"Incorrect. Submission is not equivalent to reading all cases.","C":"Correct. The producer presents the request and starts the associated case.","D":"Incorrect. Record producers do not replace the HR case model."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":9,"D":9}},{"id":"CISHR-102","domain":"Core HR Applications and Employee Center","topic":"Lifecycle notification","difficulty":"Foundation","question":"A lifecycle event activity needs to send an email. Which supporting artifact is appropriate?","options":{"A":"An email notification template for that activity","B":"An additional HR case inheritance table","C":"An unrelated IT incident form layout","D":"A second catalog category with the same title"},"correct_answer":"A","explanations":{"A":"Correct. The activity's notification uses a configured email template.","B":"Incorrect. A new table is not required merely for email content.","C":"Incorrect. Incident layout does not define the lifecycle notification.","D":"Incorrect. A category is not a notification mechanism."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":7,"B":6,"C":6,"D":8}},{"id":"CISHR-103","domain":"Platform, Role, and Contextual Security","topic":"Security and reclassification","difficulty":"Intermediate","question":"A case disappears from an HR agent's list immediately after reclassification. What should be investigated?","options":{"A":"The number of unread portal announcements","B":"The destination COE's read-access security policy","C":"The employee's preferred notification color","D":"The order of the subject person's personal bookmarks"},"correct_answer":"B","explanations":{"A":"Incorrect. Announcements do not decide restricted HR case access.","B":"Correct. A new COE policy can make the case inaccessible.","C":"Incorrect. Notification colors are unrelated to ACL policy.","D":"Incorrect. Bookmarks do not determine case-reader permissions."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":6,"B":6,"C":5,"D":8}},{"id":"CISHR-104","domain":"HR System Architecture","topic":"HR internal services","difficulty":"Advanced","question":"In an HRSD implementation review, what is appropriate for an HR service that agents initiate internally?","options":{"A":"Create an IT incident template in place of HR service","B":"Configure the HR service and its HR case template","C":"Create a portal category without defining a service","D":"Create a public record producer for every internal service"},"correct_answer":"B","explanations":{"A":"Incorrect. An IT incident template does not define an HR service.","B":"Correct. Internal-only services need not be presented as a record producer.","C":"Incorrect. Catalog organization alone does not produce an HR case.","D":"Incorrect. Public presentation is not needed for internal-only services."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":10,"B":9,"C":8,"D":9}},{"id":"CISHR-105","domain":"Core HR Applications and Employee Center","topic":"Case creation defaults","difficulty":"Foundation","question":"An HR team wants consistent assignment fields on new cases. Which mechanism is appropriate?","options":{"A":"Create an additional COE for every new assigned agent","B":"Store assignment instructions only in catalog images","C":"Require employees to edit table access controls on submission","D":"Apply relevant HR case templates and assignment rules"},"correct_answer":"D","explanations":{"A":"Incorrect. COEs represent HR functional domains rather than individuals.","B":"Incorrect. Images are not executable routing configuration.","C":"Incorrect. Employees should not manage ACL settings.","D":"Correct. Templates and rules provide defaults and routing as configured."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":9,"B":7,"C":9,"D":8}},{"id":"CISHR-106","domain":"Core HR Applications and Employee Center","topic":"Lifecycle role","difficulty":"Intermediate","question":"Which role is documented as required to configure the lifecycle-event HR service?","options":{"A":"catalog_user","B":"itil","C":"sn_hr_core.admin","D":"snc_internal"},"correct_answer":"C","explanations":{"A":"Incorrect. Catalog access alone does not provide HR service administration.","B":"Incorrect. A general IT fulfillment role is not the required HR admin role.","C":"Correct. The HR administration role is required by the procedure.","D":"Incorrect. Being an internal user alone is not HR configuration authority."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":1,"B":1,"C":1,"D":1}},{"id":"CISHR-107","domain":"HR System Architecture","topic":"Subject person","difficulty":"Advanced","question":"For service eligibility during HR case creation, whose attributes are relevant?","options":{"A":"The selected subject person's attributes and HR criteria","B":"The HR agent's last successful login location","C":"The service owner's preferred workspace theme","D":"The system administrator's department and manager"},"correct_answer":"A","explanations":{"A":"Correct. The available services are filtered against the subject person.","B":"Incorrect. Agent login location is not the service eligibility subject.","C":"Incorrect. Interface preferences do not determine subject eligibility.","D":"Incorrect. Administrator profile data does not determine employee eligibility."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":1,"option_lengths_words":{"A":8,"B":7,"C":6,"D":6}},{"id":"CISHR-108","domain":"Platform, Role, and Contextual Security","topic":"Security performance","difficulty":"Foundation","question":"In an HRSD implementation review, a COE security policy uses many complex record conditions. What should the reviewer consider?","options":{"A":"Whether every case has exactly one attachment","B":"Whether the catalog item icon has adequate contrast","C":"Whether agents have identical browser favorites","D":"Their possible effect on authorization-check performance"},"correct_answer":"D","explanations":{"A":"Incorrect. Attachment count is not the core policy-condition concern.","B":"Incorrect. Icon visibility does not assess policy evaluation overhead.","C":"Incorrect. Browser favorites are unrelated to authorization evaluation.","D":"Correct. The documentation cautions that condition complexity can affect performance."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":7,"B":8,"C":6,"D":6}},{"id":"CISHR-109","domain":"Core HR Applications and Employee Center","topic":"HR case creation","difficulty":"Intermediate","question":"Why are HR criteria relevant to the Subject person field?","options":{"A":"They control portal colors by the subject person's role","B":"They filter eligible HR services for the selected person","C":"They define the administrator allowed to edit all profiles","D":"They determine the total number of COE tables installed"},"correct_answer":"B","explanations":{"A":"Incorrect. Branding does not constitute HR service eligibility.","B":"Correct. Service conditions apply to the subject of the request.","C":"Incorrect. Employee eligibility and platform administration differ.","D":"Incorrect. Eligibility rules do not change installed data tables."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":1,"option_lengths_words":{"A":9,"B":9,"C":9,"D":9}},{"id":"CISHR-110","domain":"HR System Architecture","topic":"Record producers","difficulty":"Advanced","question":"An existing internal HR service must become available in self-service. What should be added?","options":{"A":"A second COE solely for employee requests","B":"A second HR service created from a new catalog item","C":"A record producer linked to the existing service","D":"A new parent HR Case table for the request"},"correct_answer":"C","explanations":{"A":"Incorrect. Self-service does not require a new COE.","B":"Incorrect. This risks producing a duplicate HR service.","C":"Correct. It exposes the existing service without making a duplicate service.","D":"Incorrect. The existing table hierarchy is already sufficient."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":1,"option_lengths_words":{"A":7,"B":10,"C":8,"D":9}},{"id":"CISHR-111","domain":"Platform, Role, and Contextual Security","topic":"COE security policy","difficulty":"Foundation","question":"What is the purpose of an HR COE security policy?","options":{"A":"Define access to sensitive COE case records","B":"Select the country used for HR agent assignment","C":"Choose the employee portal's navigation categories","D":"Set the default employee notification language"},"correct_answer":"A","explanations":{"A":"Correct. COE security policies govern which groups can read or write cases.","B":"Incorrect. Routing selection is separate from case permissions.","C":"Incorrect. Catalog navigation is not case-level access control.","D":"Incorrect. Language selection is not COE record security."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":6,"D":6}},{"id":"CISHR-112","domain":"Core HR Applications and Employee Center","topic":"Lifecycle content","difficulty":"Intermediate","question":"Which supporting component provides scheduled content in a lifecycle event?","options":{"A":"A matching rule that ignores employee attributes","B":"A user role that exposes all confidential documents","C":"A database index on the HR Case extension table","D":"A scheduled content template for the activity"},"correct_answer":"D","explanations":{"A":"Incorrect. Agent assignment rules do not schedule content.","B":"Incorrect. Broad roles are not a content scheduling mechanism.","C":"Incorrect. Indexes do not define employee-facing scheduled content.","D":"Correct. Content activities can publish content across supported employee channels."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":9,"D":7}},{"id":"CISHR-113","domain":"HR System Architecture","topic":"Assignment priority","difficulty":"Advanced","question":"How are execution-order values interpreted by HR matching rules?","options":{"A":"A lower execution-order number is evaluated first","B":"A higher execution-order number is always evaluated first","C":"Alphabetical rule names determine the first match","D":"The order number is ignored when a group is populated"},"correct_answer":"A","explanations":{"A":"Correct. Smaller order values receive higher priority in matching.","B":"Incorrect. This reverses the documented execution-order semantics.","C":"Incorrect. The documented priority uses execution order, not names.","D":"Incorrect. Matching logic still follows configured rule order."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":7,"D":10}},{"id":"CISHR-114","domain":"Platform, Role, and Contextual Security","topic":"Platform ACLs","difficulty":"Foundation","question":"What is the role of an access control rule in HRSD?","options":{"A":"Set the employee portal's visual card arrangement","B":"Determine the country used in assignment matching","C":"Enforce authorization for protected records or operations","D":"Create a new HR service from every knowledge article"},"correct_answer":"C","explanations":{"A":"Incorrect. Portal layout is a presentation concern.","B":"Incorrect. Matching rules route cases rather than authorize access.","C":"Correct. ACLs provide platform security checks beyond catalog visibility.","D":"Incorrect. Content records do not replace ACL design."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":7,"D":9}},{"id":"CISHR-115","domain":"Platform, Role, and Contextual Security","topic":"Read versus write","difficulty":"Intermediate","question":"In an HRSD implementation review, why distinguish read and write rights in HR COE policies?","options":{"A":"Read access automatically grants every data update permission","B":"Write access always means anonymous employees can read","C":"Both rights merely control the order of catalog items","D":"Viewing a case and modifying it are separate privileges"},"correct_answer":"D","explanations":{"A":"Incorrect. Read rights do not inherently include write rights.","B":"Incorrect. Write permissions do not entail universal public visibility.","C":"Incorrect. Operation privileges are unrelated to catalog ordering.","D":"Correct. Policies permit access design at different operation levels."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":9,"D":9}},{"id":"CISHR-116","domain":"Core HR Applications and Employee Center","topic":"Employee-facing scope","difficulty":"Advanced","question":"In an HRSD implementation review, which service belongs in an HR self-service catalog?","options":{"A":"Only requests that create IT incidents rather than HR cases","B":"A service employees are permitted to request directly","C":"Every internal-only service regardless of sensitivity","D":"Every HR service configuration record in the instance"},"correct_answer":"B","explanations":{"A":"Incorrect. HR catalog offerings ordinarily initiate HR cases.","B":"Correct. Employee-facing services are exposed through published HR items.","C":"Incorrect. Internal-only requests need not be employee-visible.","D":"Incorrect. Some HR services deliberately have no catalog item."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":10,"B":8,"C":6,"D":8}},{"id":"CISHR-117","domain":"HR System Architecture","topic":"HR case vs service","difficulty":"Foundation","question":"How do an HR service and an HR case differ?","options":{"A":"The service stores attachments; the case defines portal style","B":"The case defines configuration; the service stores employees","C":"The case is a role; the service is a security group","D":"The service defines fulfillment; a case tracks one request"},"correct_answer":"D","explanations":{"A":"Incorrect. Neither statement identifies the actual primary purpose.","B":"Incorrect. This reverses the purpose of each record.","C":"Incorrect. Neither artifact is fundamentally an access role.","D":"Correct. The service is configuration and the case is an individual record."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":1,"option_lengths_words":{"A":9,"B":8,"C":11,"D":9}},{"id":"CISHR-118","domain":"Core HR Applications and Employee Center","topic":"No subject specified","difficulty":"Intermediate","question":"An HR agent cannot see a criterion-restricted service before selecting a subject person. Why?","options":{"A":"The case automatically changes its record type to Incident","B":"The restricted service must have been permanently deleted","C":"Restricted services depend on evaluating that person's criteria","D":"The agent loses their platform login when the form opens"},"correct_answer":"C","explanations":{"A":"Incorrect. Missing subject person does not convert the record type.","B":"Incorrect. Visibility can vary without any service deletion.","C":"Correct. Without the subject, only services lacking criteria are available.","D":"Incorrect. Service filtering is distinct from authentication."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":1,"option_lengths_words":{"A":9,"B":8,"C":8,"D":10}},{"id":"CISHR-119","domain":"Platform, Role, and Contextual Security","topic":"Domain-specific approvals","difficulty":"Advanced","question":"Which practice is recommended for HR approvals under domain separation?","options":{"A":"Let the employee portal theme decide approving users","B":"Use approval groups specific to the relevant domain","C":"Expose all approvals as anonymous catalog items","D":"Assign every approval to a parent-domain global group"},"correct_answer":"B","explanations":{"A":"Incorrect. Branding cannot determine approval permission.","B":"Correct. Domain-specific approvers help avoid unauthorized access.","C":"Incorrect. Public approval exposure bypasses intended authorization.","D":"Incorrect. Global approval groups can create unintended visibility."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-domain-rec.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":7,"D":8}},{"id":"CISHR-120","domain":"Core HR Applications and Employee Center","topic":"Lifecycle HR task","difficulty":"Foundation","question":"In an HRSD implementation review, an onboarding event needs an HR task activity. What should be configured?","options":{"A":"An HR task template for the activity","B":"A new Employee Center color scheme for tasks","C":"A duplicate employee profile used as the task","D":"An HR catalog category with the task name"},"correct_answer":"A","explanations":{"A":"Correct. The supporting HR task template defines the task created.","B":"Incorrect. Portal theme is unrelated to task creation.","C":"Incorrect. Profile records are not HR task templates.","D":"Incorrect. Catalog grouping does not supply HR task configuration."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":7,"B":8,"C":8,"D":8}},{"id":"CISHR-121","domain":"Platform, Role, and Contextual Security","topic":"COE policy conditions","difficulty":"Intermediate","question":"Why can conditions on HR COE security policies be useful?","options":{"A":"They restrict permissions to records matching defined criteria","B":"They remove the need for all HR roles and groups","C":"They replace all platform ACL evaluation automatically","D":"They publish every confidential HR service in the catalog"},"correct_answer":"A","explanations":{"A":"Correct. Conditions help refine access by case context.","B":"Incorrect. Access design still uses roles and group membership.","C":"Incorrect. Conditions do not mean every other control disappears.","D":"Incorrect. Security conditions do not make services employee-facing."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":8,"B":10,"C":7,"D":9}},{"id":"CISHR-122","domain":"Platform, Role, and Contextual Security","topic":"Domain separation","difficulty":"Advanced","question":"In an HRSD implementation review, for domain-separated HR teams, how should assignment groups generally be defined?","options":{"A":"Ignore domains because HR cases cannot be separated","B":"Use child-domain groups for every parent-domain rule","C":"Use domain-appropriate groups for HR work routing","D":"Use one universal global group without checking membership"},"correct_answer":"C","explanations":{"A":"Incorrect. HRSD includes domain-separation considerations.","B":"Incorrect. Mixing child groups into parent assignments can create access issues.","C":"Correct. ServiceNow recommends aligning HR assignment groups to the relevant domain.","D":"Incorrect. Unrestricted global groups can produce cross-domain exposure."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-domain-rec.html","concept_variant":2,"option_lengths_words":{"A":8,"B":7,"C":7,"D":8}},{"id":"CISHR-123","domain":"Platform, Role, and Contextual Security","topic":"Security and reclassification","difficulty":"Foundation","question":"In an HRSD implementation review, a case disappears from an HR agent's list immediately after reclassification. What should be investigated?","options":{"A":"The employee's preferred notification color","B":"The destination COE's read-access security policy","C":"The number of unread portal announcements","D":"The order of the subject person's personal bookmarks"},"correct_answer":"B","explanations":{"A":"Incorrect. Notification colors are unrelated to ACL policy.","B":"Correct. A new COE policy can make the case inaccessible.","C":"Incorrect. Announcements do not decide restricted HR case access.","D":"Incorrect. Bookmarks do not determine case-reader permissions."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":5,"B":6,"C":6,"D":8}},{"id":"CISHR-124","domain":"Core HR Applications and Employee Center","topic":"Rule sequencing","difficulty":"Intermediate","question":"Two HR assignment rules both match a case. Which one should be considered first?","options":{"A":"The matching rule created most recently by an admin","B":"The matching rule assigned to the largest group","C":"The matching rule whose name sorts last alphabetically","D":"The matching rule with the lower execution order"},"correct_answer":"D","explanations":{"A":"Incorrect. Creation time is not the documented priority mechanism.","B":"Incorrect. Group size does not decide evaluation order.","C":"Incorrect. The name has no precedence over execution order.","D":"Correct. Execution order prioritizes the matching logic."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":9,"B":8,"C":8,"D":8}},{"id":"CISHR-125","domain":"Core HR Applications and Employee Center","topic":"Employee Center branding","difficulty":"Advanced","question":"What is the primary purpose of Employee Center branding configuration?","options":{"A":"Choose the COE extension table for each HR service","B":"Set contextual security for confidential HR case records","C":"Adapt the employee portal's visual identity and presentation","D":"Determine HR agent skills for assignment matching"},"correct_answer":"C","explanations":{"A":"Incorrect. COE configuration defines service data classification.","B":"Incorrect. Case access is governed through security configuration.","C":"Correct. Branding controls the employee-facing experience and visual design.","D":"Incorrect. Skills are managed separately from the portal theme."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":9,"B":8,"C":8,"D":7}},{"id":"CISHR-126","domain":"Platform, Role, and Contextual Security","topic":"Review rights","difficulty":"Foundation","question":"Which approach is most defensible for reviewing HR data security before go-live?","options":{"A":"Check only that HR case numbers increment sequentially","B":"Test cases across COEs with different access roles and groups","C":"Test only the case creation form as an administrator","D":"Check only that Employee Center menus look correct"},"correct_answer":"B","explanations":{"A":"Incorrect. Case numbering does not establish security correctness.","B":"Correct. Representative access testing probes contextual boundaries.","C":"Incorrect. Admin-only testing will miss ordinary user restrictions.","D":"Incorrect. Menu visibility is not a substitute for data authorization."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":8,"B":10,"C":9,"D":8}},{"id":"CISHR-127","domain":"HR System Architecture","topic":"Duplicate record producers","difficulty":"Intermediate","question":"What configuration does ServiceNow advise avoiding for one HR service?","options":{"A":"Multiple record producers invoking the same service","B":"Multiple HR tasks belonging to the same case","C":"Multiple assignment rules across unrelated COEs","D":"Multiple articles linked to one HR knowledge base"},"correct_answer":"A","explanations":{"A":"Correct. The documented recommendation is not to configure multiple producers for one service.","B":"Incorrect. Case fulfillment may legitimately involve several tasks.","C":"Incorrect. Rules can be defined per relevant COE or table.","D":"Incorrect. Articles can coexist in the same knowledge base."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":6,"D":8}},{"id":"CISHR-128","domain":"Platform, Role, and Contextual Security","topic":"Sensitive HR data","difficulty":"Advanced","question":"What design decision best suits employee relations cases with confidential information?","options":{"A":"Expose the cases through an unrestricted employee catalog","B":"Assign every case to all employees for collaboration","C":"Put sensitive details into a public knowledge article","D":"Use appropriate COE access policies and group restrictions"},"correct_answer":"D","explanations":{"A":"Incorrect. General discovery is not authorization for confidential records.","B":"Incorrect. Employee-wide assignment would compromise privacy.","C":"Incorrect. Public content is inappropriate for personal confidential data.","D":"Correct. Sensitive cases need controlled record and group access."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":8}},{"id":"CISHR-129","domain":"Core HR Applications and Employee Center","topic":"Lifecycle activity audience","difficulty":"Foundation","question":"In an HRSD implementation review, what is the purpose of an audience on a lifecycle event activity?","options":{"A":"To decide which administrators can install new plugins","B":"To decide which catalog categories appear in search","C":"To decide which COE table inherits from HR Case","D":"To decide which subject people receive that activity"},"correct_answer":"D","explanations":{"A":"Incorrect. Plugin installation permissions are unrelated to activity audiences.","B":"Incorrect. Activity applicability is separate from catalog presentation.","C":"Incorrect. Audience filters do not change table inheritance.","D":"Correct. Audience conditions make event activities relevant to specific employees."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":9,"D":8}},{"id":"CISHR-130","domain":"Core HR Applications and Employee Center","topic":"Workload matching","difficulty":"Intermediate","question":"In an HRSD implementation review, two eligible HR agents match a case. What behavior is documented for automatic matching?","options":{"A":"Prefer the agent who owns more knowledge articles","B":"Prefer the eligible agent with the lower active HR workload","C":"Prefer the agent with the most portal bookmarks","D":"Prefer whichever agent has the longer display name"},"correct_answer":"B","explanations":{"A":"Incorrect. Article ownership is not the base matching load metric.","B":"Correct. The assignment API sorts eligible agents using active HR work.","C":"Incorrect. Portal bookmarks are unrelated to case allocation.","D":"Incorrect. Display names are not the documented workload comparator."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":8,"B":10,"C":8,"D":8}},{"id":"CISHR-131","domain":"Core HR Applications and Employee Center","topic":"AWA capacity","difficulty":"Advanced","question":"In an HRSD implementation review, in HR Advanced Work Assignment, what can capacity-based assignment consider?","options":{"A":"Agents with available capacity for incoming work","B":"The last published Employee Center branding change","C":"The number of HR profiles stored in the instance","D":"Catalog category names ordered alphabetically"},"correct_answer":"A","explanations":{"A":"Correct. AWA routing evaluates agent availability and work capacity.","B":"Incorrect. Branding changes are irrelevant to agent capacity.","C":"Incorrect. Profile volume does not give an agent's available capacity.","D":"Incorrect. Catalog sort order does not define agent capacity."},"source_url":"https://www.servicenow.com/docs/r/xanadu/employee-service-management/hr-service-delivery/awa-hr-overview.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":9,"D":5}},{"id":"CISHR-132","domain":"HR System Architecture","topic":"HR catalog relationship","difficulty":"Foundation","question":"In an HRSD implementation review, which relationship between HR services and catalog items is correct?","options":{"A":"Every catalog category creates an HR case table","B":"Every HR service must belong to the IT service catalog","C":"Every HR catalog item has a corresponding HR service","D":"Every HR service must have its own catalog item"},"correct_answer":"C","explanations":{"A":"Incorrect. Catalog categories group items rather than create tables.","B":"Incorrect. HR services can be offered in an HR-specific catalog.","C":"Correct. Some services are internal-only and have no employee-facing catalog item.","D":"Incorrect. Internal-only HR services need no catalog presentation."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":8,"B":10,"C":9,"D":9}},{"id":"CISHR-133","domain":"HR System Architecture","topic":"HR case inheritance","difficulty":"Intermediate","question":"Which data-model relationship correctly describes an HR Center of Excellence?","options":{"A":"Its case table extends an HR Catalog Item","B":"Its case table extends the Knowledge article table","C":"Its case table extends an HR Profile record","D":"Its case table extends the parent HR Case table"},"correct_answer":"D","explanations":{"A":"Incorrect. Catalog items initiate requests rather than define case inheritance.","B":"Incorrect. Knowledge articles are content records rather than HR cases.","C":"Incorrect. HR profiles store person data rather than case types.","D":"Correct. COE-specific case tables extend sn_hr_core_case."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-centers-of-excellence-coes.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":9}},{"id":"CISHR-134","domain":"Platform, Role, and Contextual Security","topic":"Employee self-service","difficulty":"Advanced","question":"In an HRSD implementation review, an employee can request an HR service. Which access conclusion is justified?","options":{"A":"The employee can now see all cases under the same COE","B":"The employee can bypass read ACLs during submission","C":"Request permission does not imply access to unrelated HR cases","D":"The employee becomes an HR case administrator for that COE"},"correct_answer":"C","explanations":{"A":"Incorrect. Service request access is not universal COE data access.","B":"Incorrect. Submission does not inherently bypass ACL enforcement.","C":"Correct. Catalog eligibility and case read authorization are separate.","D":"Incorrect. Self-service permission does not imply administrator rights."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":11,"B":8,"C":10,"D":10}},{"id":"CISHR-135","domain":"HR System Architecture","topic":"HR case lifecycle","difficulty":"Foundation","question":"Which artifact is produced when an employee submits a published HR catalog item?","options":{"A":"An HR case associated with its HR service","B":"A separate incident in the IT service catalog","C":"A new HR profile for the submitting employee","D":"An HR knowledge article awaiting publication"},"correct_answer":"A","explanations":{"A":"Correct. The catalog submission initiates the HR service through a case.","B":"Incorrect. HR requests are represented using the HR case process.","C":"Incorrect. Submitting an item does not itself require a new profile.","D":"Incorrect. Knowledge content is not created by request submission."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":6}},{"id":"CISHR-136","domain":"Core HR Applications and Employee Center","topic":"Existing HR service","difficulty":"Intermediate","question":"An existing HR service requires employee access. Which implementation is most suitable?","options":{"A":"Relocate the HR service to the incident case hierarchy","B":"Add a record producer that invokes the existing HR service","C":"Create an entirely new HR service with the same purpose","D":"Assign every employee the HR service administrator role"},"correct_answer":"B","explanations":{"A":"Incorrect. Changing record type is unnecessary for self-service.","B":"Correct. This exposes the existing service without duplication.","C":"Incorrect. New catalog item creation may duplicate the existing service.","D":"Incorrect. Employees need request access rather than configuration privileges."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":1,"option_lengths_words":{"A":9,"B":10,"C":10,"D":8}},{"id":"CISHR-137","domain":"Core HR Applications and Employee Center","topic":"AWA mandatory skills","difficulty":"Advanced","question":"What occurs if skills are mandatory and no qualified AWA agent is available?","options":{"A":"The work waits until an agent with required skills is available","B":"The work is converted automatically into a knowledge article","C":"The work is immediately routed to any logged-in employee","D":"The work is permanently removed from the HR system"},"correct_answer":"A","explanations":{"A":"Correct. Mandatory skills prevent routing to unsuitable agents.","B":"Incorrect. Waiting for assignment does not convert record types.","C":"Incorrect. Employee logins do not override mandatory HR agent skills.","D":"Incorrect. No qualified agent does not delete the work item."},"source_url":"https://www.servicenow.com/docs/r/xanadu/employee-service-management/hr-service-delivery/awa-hr-overview.html","concept_variant":1,"option_lengths_words":{"A":11,"B":9,"C":9,"D":9}},{"id":"CISHR-138","domain":"Platform, Role, and Contextual Security","topic":"HR case reader","difficulty":"Foundation","question":"How should the HR case reader capability be treated in a security design?","options":{"A":"As an Employee Center branding configuration option","B":"As an automatic assignment rule for HR agents","C":"As part of a broader design with COE policy evaluation","D":"As permission to bypass every contextual restriction"},"correct_answer":"C","explanations":{"A":"Incorrect. Case reader is not a portal style setting.","B":"Incorrect. Access rights are different from assignment matching.","C":"Correct. Case-reader access and COE policy configuration interact.","D":"Incorrect. Case-reader capability does not justify blanket bypass assumptions."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":10,"D":7}},{"id":"CISHR-139","domain":"HR System Architecture","topic":"Assignment workload","difficulty":"Intermediate","question":"In an HRSD implementation review, which factor contributes to the least-loaded HR agent selection?","options":{"A":"Their total knowledge articles read this month","B":"Their catalog items published during the quarter","C":"Their employee portal sign-ins for the week","D":"Their active HR cases and active HR tasks"},"correct_answer":"D","explanations":{"A":"Incorrect. Knowledge consumption does not define HR assignment load.","B":"Incorrect. Catalog administration activity is not case load.","C":"Incorrect. Portal sessions are not active HR assignment workload.","D":"Correct. Documented load calculations include both active record types."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":7,"D":8}},{"id":"CISHR-140","domain":"HR System Architecture","topic":"Plugins","difficulty":"Advanced","question":"Before configuring an optional HR capability, what should the team confirm?","options":{"A":"All users have been assigned an HR administrator role","B":"Its required applications and plugins are available","C":"All HR services have been exposed in the IT catalog","D":"The employee portal uses the default company logo"},"correct_answer":"B","explanations":{"A":"Incorrect. Administrative roles should not be broadly granted.","B":"Correct. Capabilities depend on installed and activated application components.","C":"Incorrect. Catalog exposure is unrelated to application availability.","D":"Incorrect. Branding does not establish installed functionality."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":9,"B":7,"C":10,"D":8}},{"id":"CISHR-141","domain":"Platform, Role, and Contextual Security","topic":"Roles vs skills","difficulty":"Foundation","question":"In an HRSD implementation review, an HR agent has an HR skill but no permission to read a case. What is true?","options":{"A":"Any assigned skill overrides all active ACL checks","B":"Skills alone do not grant the necessary data access","C":"Changing the employee's display language grants HR read rights","D":"Adding another portal category fixes the security error"},"correct_answer":"B","explanations":{"A":"Incorrect. Skill ownership is not a universal permission mechanism.","B":"Correct. Qualifications for assignment are distinct from access authorization.","C":"Incorrect. Language changes are not authorization changes.","D":"Incorrect. Catalog organization cannot grant case read rights."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":8,"B":9,"C":9,"D":8}},{"id":"CISHR-142","domain":"HR System Architecture","topic":"Scoped customization","difficulty":"Intermediate","question":"A developer needs to customize HR matching behavior. What aligns with ServiceNow guidance?","options":{"A":"Disable all HR scopes before adding assignment logic","B":"Replace HR case tables with unrelated IT task tables","C":"Extend behavior through the supported HR assignment API","D":"Modify the underlying assignment utility without controls"},"correct_answer":"C","explanations":{"A":"Incorrect. Removing application isolation is not a supported customization plan.","B":"Incorrect. Replacing the record model is unnecessary for matching.","C":"Correct. The documented wrapper limits changes to underlying utilities.","D":"Incorrect. Direct utility modification can increase upgrade risk."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":8,"B":9,"C":8,"D":7}},{"id":"CISHR-143","domain":"HR System Architecture","topic":"Assignment fallback","difficulty":"Advanced","question":"In an HRSD implementation review, when no agent satisfies the country-and-skills match, what is typically tried next?","options":{"A":"A matching rule based on required skills alone","B":"A matching rule based only on portal theme","C":"An unconditional assignment to the instance admin","D":"An automatic closure of the HR case request"},"correct_answer":"A","explanations":{"A":"Correct. The default secondary rule relaxes the country condition.","B":"Incorrect. Portal branding does not participate in agent matching.","C":"Incorrect. The admin is not the automatic documented fallback.","D":"Incorrect. An assignment miss does not imply case resolution."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":7,"D":8}},{"id":"CISHR-144","domain":"HR System Architecture","topic":"HR task assignment","difficulty":"Foundation","question":"In an HRSD implementation review, what preference can the matching logic give when assigning an HR task?","options":{"A":"It must always assign tasks to the system administrator","B":"It must use a user outside the parent case group","C":"It assigns tasks based on catalog item alphabetical order","D":"It can prioritize the agent assigned to its parent case"},"correct_answer":"D","explanations":{"A":"Incorrect. Automatic task matching does not require administrator assignment.","B":"Incorrect. Group exclusion is not the documented default preference.","C":"Incorrect. Catalog sorting is not a task matching rule.","D":"Correct. Parent-case agent continuity can take precedence over load."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":2,"option_lengths_words":{"A":9,"B":10,"C":9,"D":10}},{"id":"CISHR-145","domain":"HR System Architecture","topic":"HR case classification","difficulty":"Intermediate","question":"How does selecting a COE affect manual HR case creation?","options":{"A":"It chooses the employee portal's branding preset","B":"It filters the available HR service choices","C":"It automatically grants case access to all HR agents","D":"It removes the need to identify the subject person"},"correct_answer":"B","explanations":{"A":"Incorrect. Portal appearance is independent of COE selection.","B":"Correct. Service offerings are associated with COE classification.","C":"Incorrect. Classification does not bypass security policy.","D":"Incorrect. Employee context may still be required for eligibility."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":1,"option_lengths_words":{"A":7,"B":7,"C":9,"D":9}},{"id":"CISHR-146","domain":"Core HR Applications and Employee Center","topic":"Employee Center branding","difficulty":"Advanced","question":"In an HRSD implementation review, what is the primary purpose of Employee Center branding configuration?","options":{"A":"Determine HR agent skills for assignment matching","B":"Set contextual security for confidential HR case records","C":"Choose the COE extension table for each HR service","D":"Adapt the employee portal's visual identity and presentation"},"correct_answer":"D","explanations":{"A":"Incorrect. Skills are managed separately from the portal theme.","B":"Incorrect. Case access is governed through security configuration.","C":"Incorrect. COE configuration defines service data classification.","D":"Correct. Branding controls the employee-facing experience and visual design."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":7,"B":8,"C":9,"D":8}},{"id":"CISHR-147","domain":"HR System Architecture","topic":"HR case lifecycle","difficulty":"Foundation","question":"In an HRSD implementation review, which artifact is produced when an employee submits a published HR catalog item?","options":{"A":"A separate incident in the IT service catalog","B":"A new HR profile for the submitting employee","C":"An HR case associated with its HR service","D":"An HR knowledge article awaiting publication"},"correct_answer":"C","explanations":{"A":"Incorrect. HR requests are represented using the HR case process.","B":"Incorrect. Submitting an item does not itself require a new profile.","C":"Correct. The catalog submission initiates the HR service through a case.","D":"Incorrect. Knowledge content is not created by request submission."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":8,"B":8,"C":8,"D":6}},{"id":"CISHR-148","domain":"HR System Architecture","topic":"Employee-facing categories","difficulty":"Intermediate","question":"An HR catalog category is renamed. What does that necessarily change?","options":{"A":"The catalog organization employees navigate","B":"The access control list on each HR case","C":"The extension table of all associated HR cases","D":"The COE of each related HR service record"},"correct_answer":"A","explanations":{"A":"Correct. Catalog categorization is separate from HR COE classification.","B":"Incorrect. A catalog label does not by itself alter ACLs.","C":"Incorrect. A label change does not change the underlying case table.","D":"Incorrect. The catalog taxonomy is independent of COE taxonomy."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":1,"option_lengths_words":{"A":5,"B":8,"C":8,"D":8}},{"id":"CISHR-149","domain":"HR System Architecture","topic":"HR profile separation","difficulty":"Advanced","question":"Which architectural practice best distinguishes HR profile information from HR cases?","options":{"A":"Keep person-related profile data separate from service requests","B":"Replace all HR profile fields with assignment group names","C":"Use HR catalog categories as the employee master data","D":"Store every employee property in case short descriptions"},"correct_answer":"A","explanations":{"A":"Correct. HR profile records concern people whereas cases represent work.","B":"Incorrect. Assignment groups are not authoritative person data.","C":"Incorrect. Catalog categories organize requests, not employee records.","D":"Incorrect. Case descriptions are not a substitute for structured profiles."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":1,"option_lengths_words":{"A":8,"B":9,"C":9,"D":8}},{"id":"CISHR-150","domain":"HR System Architecture","topic":"HR service visibility","difficulty":"Foundation","question":"In an HRSD implementation review, why might one HR service appear in agent tools but not Employee Center?","options":{"A":"Every HR service must appear on every portal automatically","B":"The HR case parent table has no extensible fields","C":"It is configured for internal initiation only","D":"Employee Center only displays IT incident requests"},"correct_answer":"C","explanations":{"A":"Incorrect. Only appropriate published catalog items are surfaced.","B":"Incorrect. Table extension does not determine catalog publication.","C":"Correct. Not all HR services are exposed as employee catalog items.","D":"Incorrect. Employee Center can present HR service requests."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-catalog-management.html","concept_variant":2,"option_lengths_words":{"A":9,"B":9,"C":7,"D":7}},{"id":"CISHR-151","domain":"Core HR Applications and Employee Center","topic":"Lifecycle HR task","difficulty":"Intermediate","question":"An onboarding event needs an HR task activity. What should be configured?","options":{"A":"A duplicate employee profile used as the task","B":"An HR catalog category with the task name","C":"A new Employee Center color scheme for tasks","D":"An HR task template for the activity"},"correct_answer":"D","explanations":{"A":"Incorrect. Profile records are not HR task templates.","B":"Incorrect. Catalog grouping does not supply HR task configuration.","C":"Incorrect. Portal theme is unrelated to task creation.","D":"Correct. The supporting HR task template defines the task created."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/configure-supporting-components-for-lifecycle-event.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":8,"D":7}},{"id":"CISHR-152","domain":"Core HR Applications and Employee Center","topic":"Existing HR service","difficulty":"Advanced","question":"In an HRSD implementation review, an existing HR service requires employee access. Which implementation is most suitable?","options":{"A":"Create an entirely new HR service with the same purpose","B":"Add a record producer that invokes the existing HR service","C":"Assign every employee the HR service administrator role","D":"Relocate the HR service to the incident case hierarchy"},"correct_answer":"B","explanations":{"A":"Incorrect. New catalog item creation may duplicate the existing service.","B":"Correct. This exposes the existing service without duplication.","C":"Incorrect. Employees need request access rather than configuration privileges.","D":"Incorrect. Changing record type is unnecessary for self-service."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-service-configuration.html","concept_variant":2,"option_lengths_words":{"A":10,"B":10,"C":8,"D":9}},{"id":"CISHR-153","domain":"Platform, Role, and Contextual Security","topic":"Policy filters","difficulty":"Foundation","question":"In an HRSD implementation review, what is a potential trade-off of complex COE security policy conditions?","options":{"A":"They automatically activate every inactive COE","B":"They eliminate the need for HR service configuration","C":"They always improve performance regardless of complexity","D":"They can affect system performance during access checks"},"correct_answer":"D","explanations":{"A":"Incorrect. Policy complexity does not govern plugin or COE activation.","B":"Incorrect. Security logic does not replace fulfillment design.","C":"Incorrect. Condition evaluation can add processing cost.","D":"Correct. The documentation warns that conditions should be used cautiously."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":2,"option_lengths_words":{"A":6,"B":8,"C":7,"D":8}},{"id":"CISHR-154","domain":"HR System Architecture","topic":"HR templates","difficulty":"Intermediate","question":"Why associate an HR case template with an HR service?","options":{"A":"To populate case fields automatically at creation","B":"To create the employee profile at every submission","C":"To assign every HR case to the same administrator","D":"To replace the HR service with an IT request"},"correct_answer":"A","explanations":{"A":"Correct. The template provides default values for new HR cases.","B":"Incorrect. A case template is not an employee profile import.","C":"Incorrect. A template may include assignment, but not all cases must share one administrator.","D":"Incorrect. Templates do not redefine the HR case application."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/configure-hr-case-template.html","concept_variant":1,"option_lengths_words":{"A":7,"B":8,"C":9,"D":9}},{"id":"CISHR-155","domain":"Platform, Role, and Contextual Security","topic":"Auditability","difficulty":"Advanced","question":"In an HRSD implementation review, why should privileged HR case access be limited to named accounts?","options":{"A":"Named accounts automatically resolve every case faster","B":"Actions can be associated with accountable individuals","C":"Named accounts enable public read access by default","D":"Named accounts eliminate all need for COE policies"},"correct_answer":"B","explanations":{"A":"Incorrect. Individual identity does not guarantee faster fulfillment.","B":"Correct. Individual access supports traceability of sensitive operations.","C":"Incorrect. Named accounts do not mean public authorization.","D":"Incorrect. Identity accountability does not replace record-level permissions."},"source_url":"https://nowlearning.servicenow.com/kb?id=kb_article_view&sysparm_article=KB0011654","concept_variant":2,"option_lengths_words":{"A":7,"B":7,"C":8,"D":8}},{"id":"CISHR-156","domain":"Core HR Applications and Employee Center","topic":"New HR catalog item","difficulty":"Foundation","question":"What happens when a new HR catalog item is created as documented?","options":{"A":"A new HR employee record is always inserted","B":"A new scoped application is created for the item","C":"A corresponding HR service is created automatically","D":"A new COE extension table is always created"},"correct_answer":"C","explanations":{"A":"Incorrect. Publishing services does not create new employees.","B":"Incorrect. Catalog items live within the existing application model.","C":"Correct. New item creation establishes its associated HR service.","D":"Incorrect. COE case tables are not generated for every item."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-catalog-item-configuration.html","concept_variant":1,"option_lengths_words":{"A":8,"B":9,"C":7,"D":8}},{"id":"CISHR-157","domain":"Core HR Applications and Employee Center","topic":"HR case creation","difficulty":"Intermediate","question":"In an HRSD implementation review, why are HR criteria relevant to the Subject person field?","options":{"A":"They control portal colors by the subject person's role","B":"They filter eligible HR services for the selected person","C":"They define the administrator allowed to edit all profiles","D":"They determine the total number of COE tables installed"},"correct_answer":"B","explanations":{"A":"Incorrect. Branding does not constitute HR service eligibility.","B":"Correct. Service conditions apply to the subject of the request.","C":"Incorrect. Employee eligibility and platform administration differ.","D":"Incorrect. Eligibility rules do not change installed data tables."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/CreateModCaseCreationConfig.html","concept_variant":2,"option_lengths_words":{"A":9,"B":9,"C":9,"D":9}},{"id":"CISHR-158","domain":"Core HR Applications and Employee Center","topic":"Lifecycle role","difficulty":"Advanced","question":"In an HRSD implementation review, which role is documented as required to configure the lifecycle-event HR service?","options":{"A":"itil","B":"catalog_user","C":"snc_internal","D":"sn_hr_core.admin"},"correct_answer":"D","explanations":{"A":"Incorrect. A general IT fulfillment role is not the required HR admin role.","B":"Incorrect. Catalog access alone does not provide HR service administration.","C":"Incorrect. Being an internal user alone is not HR configuration authority.","D":"Correct. The HR administration role is required by the procedure."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/lifecycle-events/create-hr-service-for-lifecycle-event.html","concept_variant":2,"option_lengths_words":{"A":1,"B":1,"C":1,"D":1}},{"id":"CISHR-159","domain":"Core HR Applications and Employee Center","topic":"HR task parent","difficulty":"Foundation","question":"An HR task has a parent case with an eligible assigned agent. Which result is expected?","options":{"A":"The parent case agent is never eligible for its task","B":"The HR task must be reassigned to the requester","C":"The parent case agent can be ranked ahead of other agents","D":"All task matching must ignore the associated HR case"},"correct_answer":"C","explanations":{"A":"Incorrect. Matching does not exclude the agent solely due to ownership.","B":"Incorrect. Employee requesters are not automatically task assignees.","C":"Correct. Task matching prioritizes eligible parent-case agent continuity.","D":"Incorrect. The parent case is explicitly checked in task matching."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/c_UseAssignmentRules.html","concept_variant":1,"option_lengths_words":{"A":10,"B":9,"C":11,"D":9}},{"id":"CISHR-160","domain":"Platform, Role, and Contextual Security","topic":"Reclassification impact","difficulty":"Intermediate","question":"After an HR case moves to another COE, what security effect is possible?","options":{"A":"An agent may lose access under the new COE policy","B":"The case automatically becomes public to all employees","C":"The employee's profile must always be recreated","D":"The HR service catalog is deleted for the entire instance"},"correct_answer":"A","explanations":{"A":"Correct. Reclassification changes the relevant security context.","B":"Incorrect. Changing COE does not imply open public access.","C":"Incorrect. COE reclassification does not require new profiles.","D":"Incorrect. Case classification does not delete the service catalog."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":10,"B":8,"C":7,"D":10}},{"id":"CISHR-161","domain":"Platform, Role, and Contextual Security","topic":"Read versus write","difficulty":"Advanced","question":"Why distinguish read and write rights in HR COE policies?","options":{"A":"Write access always means anonymous employees can read","B":"Read access automatically grants every data update permission","C":"Viewing a case and modifying it are separate privileges","D":"Both rights merely control the order of catalog items"},"correct_answer":"C","explanations":{"A":"Incorrect. Write permissions do not entail universal public visibility.","B":"Incorrect. Read rights do not inherently include write rights.","C":"Correct. Policies permit access design at different operation levels.","D":"Incorrect. Operation privileges are unrelated to catalog ordering."},"source_url":"https://www.servicenow.com/docs/r/employee-service-management/hr-service-delivery/hr-coe-security-policies.html","concept_variant":1,"option_lengths_words":{"A":8,"B":8,"C":9,"D":9}},{"id":"CISHR-162","domain":"Core HR Applications and Employee Center","topic":"Audience non-match","difficulty":"Foundation","question":"In an HRSD implementation review, an employee does not meet the audience condition of a lifecycle event activity. What happens?","options":{"A":"The activity becomes a public catalog request","B":"The employee's entire HR profile is deleted","C":"The activity is reassigned to the system administrator","D":"The inapplicable activity is skipped"},"correc
